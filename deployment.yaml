apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: my-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: my-app }
  template:
    metadata:
      labels: { app: my-app }
    spec:
      containers:
        - name: my-app
          image: <your-image>:latest   # e.g. from Docker Hub or ECR
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: my-app
  namespace: my-app
spec:
  type: LoadBalancer      # gives you a public URL in EKS
  selector: { app: my-app }
  ports:
    - port: 80
      targetPort: 8080
