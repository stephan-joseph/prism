apiVersion: apps/v1
kind: Deployment
metadata:
  name: prism
  namespace: prism-damo
spec:
  replicas: 1
  # One replica only: extraction jobs are held in this pod's memory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prism
  template:
    metadata:
      labels:
        app: prism
    spec:
      # The volume is mounted root-owned. This lets the app's user (node, uid 1000) write the accounts and audit files.
      securityContext:
        fsGroup: 1000
      containers:
        - name: prism
          image: stejose/prism:20261126-1
          ports:
            - containerPort: 8080
          env:
            # Create this Secret by hand, it is not in Git:
            #   kubectl -n prism-damo create secret generic prism-secrets \
            #     --from-literal=ANTHROPIC_API_KEY=... --from-literal=INTAKE_PASSPHRASE=... \
            #     [--from-literal=USAGE_ADMIN_KEY=...]
            # Optional, so the pod starts without it (extraction then says the key is missing).
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: prism-secrets, key: ANTHROPIC_API_KEY, optional: true}}
            # Internal gateway: the token is sent as a Bearer token. The URL is not secret.
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom: {secretKeyRef: {name: prism-secrets, key: ANTHROPIC_AUTH_TOKEN, optional: true}}
            - name: ANTHROPIC_BASE_URL
              value: https://api.thoughtworks.polis.thoughtworks-labs.net
            - name: EXTRACTION_MODEL
              value: claude-sonnet-5-5
            - name: LIBRARY_URL
              value: http://aa93d0400fe3448ceb299f9303352f1d-1572819596.ap-southeast-1.elb.amazonaws.com
              value: http://aa93d0400fe3448ceb299f9303352f1d-1572819596.ap-southeast-1.elb.amazonaws.com
            - name: INTAKE_PASSPHRASE
              valueFrom: {secretKeyRef: {name: prism-secrets, key: INTAKE_PASSPHRASE, optional: true}}
            # Address of the Prism Library service, used by File, Add to Prism Library. Set it to the Library's address in this cluster.
            - name: USAGE_ADMIN_KEY
              valueFrom: {secretKeyRef: {name: prism-secrets, key: USAGE_ADMIN_KEY, optional: true}}
            # Sign-in turns on when SESSION_SECRET is set (a long random string). The first administrator is created once,
            # from ADMIN_EMAIL and ADMIN_PASSWORD, only while there are no accounts; they must change the password at first sign-in.
            #   kubectl -n prism-damo patch secret prism-secrets --type merge -p '{"stringData":{"SESSION_SECRET":"...","ADMIN_EMAIL":"...","ADMIN_PASSWORD":"..."}}'
            - name: SESSION_SECRET
              valueFrom: {secretKeyRef: {name: prism-secrets, key: SESSION_SECRET, optional: true}}
            - name: ADMIN_EMAIL
              valueFrom: {secretKeyRef: {name: prism-secrets, key: ADMIN_EMAIL, optional: true}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: prism-secrets, key: ADMIN_PASSWORD, optional: true}}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prism-data
