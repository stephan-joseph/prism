apiVersion: apps/v1
kind: Deployment
metadata:
  name: prism
  namespace: prism-damo
spec:
  replicas: 1
  # One replica only: extraction jobs are held in this pod's memory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prism
  template:
    metadata:
      labels:
        app: prism
    spec:
      containers:
        - name: prism
          image: stejose/prism:20261105-5
          ports:
            - containerPort: 8080
          env:
            # Create this Secret by hand, it is not in Git:
            #   kubectl -n prism-damo create secret generic prism-secrets \
            #     --from-literal=ANTHROPIC_API_KEY=... --from-literal=INTAKE_PASSPHRASE=... \
            #     [--from-literal=USAGE_ADMIN_KEY=...]
            # Optional, so the pod starts without it (extraction then says the key is missing).
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: prism-secrets, key: ANTHROPIC_API_KEY, optional: true}}
            # Internal gateway: the token is sent as a Bearer token. The URL is not secret.
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom: {secretKeyRef: {name: prism-secrets, key: ANTHROPIC_AUTH_TOKEN, optional: true}}
            - name: ANTHROPIC_BASE_URL
              value: https://api.thoughtworks.polis.thoughtworks-labs.net
            - name: EXTRACTION_MODEL
              value: claude-sonnet-5-5
            - name: INTAKE_PASSPHRASE
              valueFrom: {secretKeyRef: {name: prism-secrets, key: INTAKE_PASSPHRASE, optional: true}}
            # Address of the Prism Library service, used by File, Add to Prism Library. Set it to the Library's address in this cluster.
            - name: LIBRARY_URL
              value: http://ae8cff7cf27bf4ac8aeac3982d1a52aa-348236912.ap-southeast-1.elb.amazonaws.com
            - name: USAGE_ADMIN_KEY
              valueFrom: {secretKeyRef: {name: prism-secrets, key: USAGE_ADMIN_KEY, optional: true}}
          volumeMounts:
            - name: usage
              mountPath: /data/usage
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: usage
          emptyDir: {}
