apiVersion: apps/v1
kind: Deployment
metadata:
  name: prism
  namespace: prism-damo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prism
  template:
    metadata:
      labels:
        app: prism
    spec:
      containers:
        - name: prism
          image: stejose/prism:latest
          ports:
            - containerPort: 80
