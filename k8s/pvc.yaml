# Holds the accounts, the audit log and the usage history, so they survive a restart or a new image.
# Needs a working storage class on the cluster (check: kubectl get storageclass). Single replica only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prism-data
  namespace: prism-damo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
