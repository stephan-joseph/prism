<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAMO Prism Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#F8F9FB; --ink:#18202B; --muted:#5A6472; --faint:#8A93A0;
  --line:#DCE0E7; --accent:#9B2F66; --accent-ink:#FFFFFF; --accent-soft:#F7E8F0;
  --add:#2B7657; --add-soft:#E3F2EB; --risk:#A9620E; --risk-soft:#FBEEDC; --round:#4F5FA8; --round-soft:#E8EBF8;
  --warn:#B3261E; --warn-soft:#FBE5E3;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10141A; --surface:#181E27; --surface-2:#1D242E; --ink:#E7EBF0; --muted:#A0A9B6; --faint:#6F7987;
    --line:#2B333F; --accent:#E27AAF; --accent-ink:#1A0E14; --accent-soft:#3A1F2D;
    --add:#63C095; --add-soft:#173327; --risk:#E6A85C; --risk-soft:#3A2A15; --round:#98A6EA; --round-soft:#232A45;
    --warn:#F08A80; --warn-soft:#3C1D1B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10141A; --surface:#181E27; --surface-2:#1D242E; --ink:#E7EBF0; --muted:#A0A9B6; --faint:#6F7987;
  --line:#2B333F; --accent:#E27AAF; --accent-ink:#1A0E14; --accent-soft:#3A1F2D;
  --add:#63C095; --add-soft:#173327; --risk:#E6A85C; --risk-soft:#3A2A15; --round:#98A6EA; --round-soft:#232A45;
  --warn:#F08A80; --warn-soft:#3C1D1B;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0}
code,.mono{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.brand{margin-right:auto;display:grid;gap:2px}
.brand .eb{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand b{font:800 19px/1.1 var(--display)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prog .bar{width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;font:500 14px var(--body);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:13px}

.layout{max-width:1200px;margin:0 auto;padding:24px 20px 60px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px}
nav.toc{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
nav.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
nav.toc button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--muted)}
nav.toc button:hover{background:var(--surface)}
nav.toc button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
nav.toc .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:600 11px var(--mono);color:var(--muted)}
nav.toc .done .n{background:var(--add);border-color:var(--add);color:#fff}
nav.toc .grp{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:14px 10px 4px}
.tocsel{display:none;width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit}

main{min-width:0}
.chap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 32px}
.chap .eyebrow{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.chap h1{font-size:30px;margin:6px 0 10px}
.chap h2{font-size:20px;margin:28px 0 8px}
.chap h3{font-size:16px;margin:18px 0 6px}
.chap p{margin:8px 0}
.lead{font-size:18px;color:var(--muted);max-width:70ch}
.chap ul,.chap ol{padding-left:22px}
.chap li{margin:4px 0}
.steps{counter-reset:s;list-style:none;padding:0!important;display:grid;gap:10px}
.steps>li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;margin:0}
.steps>li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px var(--mono);margin-top:1px}
.ui{font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.93em;white-space:nowrap}
.tip,.warn,.note{border-radius:8px;padding:12px 14px;margin:14px 0;font-size:15px}
.tip{background:var(--add-soft);border-left:3px solid var(--add)}
.warn{background:var(--risk-soft);border-left:3px solid var(--risk)}
.note{background:var(--surface-2);border-left:3px solid var(--line)}
.tip b:first-child,.warn b:first-child,.note b:first-child{display:block;margin-bottom:2px}
table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
th{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.r{text-align:right;white-space:nowrap}
.tbl{overflow-x:auto}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--surface-2)}
.card h3{margin-top:0}
.chapnav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.try{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0;padding:12px 14px;border:1px dashed var(--accent);border-radius:8px;background:var(--accent-soft)}
.try span{font-size:14px}

/* calculators */
.calc{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:18px 0;background:var(--surface-2)}
.calc h3{margin:0 0 4px;font-size:16px}
.calc .sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.calc .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.calc label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.calc input,.calc select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;min-width:0}
.calc input[type=range]{padding:0}
.out{margin-top:14px;display:grid;gap:6px;font:14px/1.5 var(--mono)}
.out .row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:6px 10px;border-radius:6px;background:var(--surface)}
.out .row.tot{background:var(--accent-soft);font-weight:600}
.out .row span:first-child{font-family:var(--body)}
.out .f{font-size:12px;color:var(--muted);grid-column:1/-1}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer;font:500 13px var(--body)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* diagram */
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin:16px 0}
.teams .box{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface-2)}
.teams .box b{display:block;font-family:var(--display);font-size:16px;margin-bottom:4px}
.teams .vs{display:grid;place-items:center;font:700 14px var(--mono);color:var(--accent)}
.teams .res{grid-column:1/-1;text-align:center;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px;font-weight:600}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0}
.flow span{padding:6px 10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.flow i{font-style:normal;color:var(--faint)}

/* quiz */
.quiz{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:22px 0 0}
.quiz h3{margin:0 0 10px;font-size:16px}
.q{margin:14px 0}
.q p{margin:0 0 8px;font-weight:600}
.q .opts{display:grid;gap:6px}
.q button{all:unset;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:14px;background:var(--surface)}
.q button:hover{border-color:var(--accent)}
.q button.right{border-color:var(--add);background:var(--add-soft)}
.q button.wrong{border-color:var(--warn);background:var(--warn-soft)}
.q .why{font-size:14px;color:var(--muted);margin-top:6px}
.score{font-weight:600;margin-top:8px}

/* checklist + glossary */
.check{list-style:none;padding:0!important;display:grid;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);cursor:pointer}
.check input{margin-top:4px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;margin:8px 0 12px}
dl.gl{margin:0;display:grid;gap:10px}
dl.gl div{border-bottom:1px solid var(--line);padding-bottom:10px}
dl.gl dt{font-weight:600}
dl.gl dd{margin:2px 0 0;color:var(--muted);font-size:15px}
details.faq{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:8px 0;background:var(--surface-2)}
details.faq summary{cursor:pointer;font-weight:600}
details.faq p{margin:8px 0 2px;color:var(--muted);font-size:15px}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 16px 48px}
  nav.toc{display:none}
  .tocsel{display:block;margin-bottom:12px}
  .chap{padding:20px 16px}
  .cols2,.teams{grid-template-columns:1fr}
  .teams .vs{padding:4px}
  .prog .bar{width:80px}
}
@media print{.top,nav.toc,.tocsel,.chapnav,.try{display:none}.layout{display:block}.chap{border:0}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <div class="brand"><span class="eb">Estimation as a Service</span><b>DAMO Prism · User guide</b></div>
    <div class="prog" aria-live="polite"><span id="progTxt">0 of 0 read</span><span class="bar"><i id="progBar"></i></span></div>
    <a class="btn primary" href="index.html" target="_blank" rel="noopener">Open the tool ↗</a>
  </div>
</header>

<div class="layout">
  <nav class="toc" aria-label="Guide chapters"><ol id="toc"></ol></nav>
  <main>
    <select class="tocsel" id="tocSel" aria-label="Go to chapter"></select>
    <article class="chap" id="chap" tabindex="-1"></article>
  </main>
</div>

<script>
(function(){
"use strict";
const KEY="damo-workflow-guide-v1";
let P={};try{P=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){P={}}
P.done=P.done||{};P.check=P.check||{};P.quiz=P.quiz||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(x,d=2)=>(Math.round(x*10**d)/10**d).toFixed(d);
const tryTool=(n,text)=>`<div class="try"><a class="btn sm primary" href="index.html#stage=${n}" target="_blank" rel="noopener">Open ${n===0?"Documents":"step "+({1:1,2:2,3:5,4:10,5:4,6:8,7:11,8:13,9:3,10:14,11:6,12:7,13:9,14:12})[n]} in the tool ↗</a><span>${text}</span></div>`;

/* ================= chapters ================= */
const CH=[
{id:"welcome",grp:"Start here",t:"What the tool does",html:()=>`
<span class="eyebrow">Start here · 5 min</span>
<h1>What DAMO Prism does</h1>
<p class="lead">It sizes a DAMO managed-service team in FTE, one step at a time, so a deal review can see exactly how the number was built: every input, formula, assumption and risk. The fourteen steps run in three stages, then a review: <b>Stage 1</b> sizes the team, <b>Stage 2</b> qualifies it, <b>Stage 3</b> adds transformation capacity and productivity.</p>
<h2>The one idea to understand first</h2>
<p>Stage 1 sizes the team from what the service needs, not from what the client has today. The base team and the work team are built from two different questions and the larger is kept; they are compared, not added. The team running the estate today is a <b>reference range</b>, not a driver.</p>
<div class="teams">
  <div class="box"><b>Base team · Step 1</b>How many people keep someone on duty in every hour?<br><span style="color:var(--muted);font-size:14px">Support window, each location's working and on-call hours, people on duty. Ignores ticket volume.</span></div>
  <div class="vs">vs</div>
  <div class="box"><b>Work team · Step 2</b>How many people does the work take?<br><span style="color:var(--muted);font-size:14px">Per tower, either volumetrics (tickets, SLAs, enhancements) or thin slices (applications or data products by criticality), with skill sets, leave and risk.</span></div>
  <div class="res">Step 4: delivery team = the larger of the two + SDM = the Stage 1 team. Step 3 checks it against today's team as a reference range. Stage 2 then tests skill type, location, managers and contingency to give the <b>run team</b>; Stage 3 adds <b>transformation capacity</b>. Year 1 shows both lines.</div>
</div>
<p>If the work team is bigger, the people doing the work also staff the windows. If the base team is bigger, the windows need more people than the work, so the team is lifted to the base team and the spare time is shown. Stage 2 uses that spare time first. Step 4 names the <b>binding dimension</b>: coverage or the work, whichever set the number.</p>
<h2>The steps</h2>
<div class="tbl"><table>
<thead><tr><th>#</th><th>Step</th><th>What you decide</th></tr></thead>
<tbody>
<tr><td>0</td><td>Documents</td><td>Upload RFP, incident dump, notes; Claude proposes inputs (optional)</td></tr>
<tr><td>0</td><td>Contract clauses</td><td>List the clauses that size the team and link each to the towers that serve it (optional). It explains the number and never changes it</td></tr>
<tr><td colspan="3"><b>Stage 1 · Size the team</b></td></tr>
<tr><td>1</td><td>Coverage</td><td>Support window, customer time zone, each location's working and on-call windows, people on duty</td></tr>
<tr><td>2</td><td>Service towers</td><td>Towers, who provides L1/L2/L3, SLAs, and per tower: volumetrics or thin slices</td></tr>
<tr><td>3</td><td>Current team</td><td>Today's team by tier as a reference range, compared with the ticket volume and the base team</td></tr>
<tr><td>4</td><td>Required team size</td><td>Base vs work team, the larger wins; SDM at 1:12. Result: the Stage 1 team and its binding dimension</td></tr>
<tr><td colspan="3"><b>Stage 2 · Qualify the team</b></td></tr>
<tr><td>5</td><td>Skill type</td><td>Which windows each specialist must be live in: is the Stage 1 team enough, or is headcount added?</td></tr>
<tr><td>6</td><td>Location distribution</td><td>Where the team sits across locations, and the overlap between them</td></tr>
<tr><td>7</td><td>Managerial capacity</td><td>SDM ratio and location, tech lead</td></tr>
<tr><td>8</td><td>Complexity, seniority and contingency</td><td>Complexity, grade pyramid (mix only), contingency, confidence score. Result: the <b>run team</b></td></tr>
<tr><td>9</td><td>Team shape: Year 1</td><td>The Year 1 team by role from the DAMO roles guidance map: the screen for a solution architect to review the team overall</td></tr>
<tr><td colspan="3"><b>Stage 3 · Transformation and productivity</b></td></tr>
<tr><td>10</td><td>Transformation</td><td>Client AI adoption, application life stage, client appetite, clarity of improvement pathways → POD share</td></tr>
<tr><td>11</td><td>Capacity ramp and savings</td><td>Contract term, Year 2+ savings, optional transition. Year 1 shows the run team and the transformation capacity as two lines</td></tr>
<tr><td>12</td><td>Team shape by year</td><td>The team by role for every year of the term</td></tr>
<tr><td colspan="3"><b>Review and commercial</b></td></tr>
<tr><td>13</td><td>Final fact check &amp; approval</td><td>The final team against the existing team, assumptions register, roles, allowances, approval, exports</td></tr>
<tr><td>14</td><td>Commercial position</td><td>Optional proposed final number, risks and commercial options</td></tr>
</tbody></table></div>
<h2>What stays true everywhere</h2>
<ul>
<li><b>FTE only.</b> No rates, cost or price. The pricing sheet takes the FTE by grade and location.</li>
<li><b>After every step:</b> assumptions and risks. Assumptions are grouped by category (coverage, demand, scope, SLA, effort, skills, transformation, governance, seniority, term, client responsibilities) and gathered in one register at step 13. Risks carry an FTE modifier %; suggested ones start switched off.</li>
<li><b>The bar at the bottom</b> shows the team after the step you're on: the Stage 1 team at steps 1 to 4, the run team through Stage 2, and from Stage 3 the transformation capacity on top, giving the Year 1 team.</li>
<li><b>Sources are tagged</b> <code>[F]</code> framework, <code>[P]</code> pricing sheet, or <code>proposed</code> where the framework is silent.</li>
<li><b>Your work is saved in your browser</b> automatically. The <span class="ui">File</span> menu has Open file, Save file and Reset; the <span class="ui">Export</span> menu has the deal-review summary, the customer summary, the Excel workbook and Copy summary.</li>
<li><b>The tabs at the top</b> are the stages, each showing its team: Stage 1 the Stage 1 team, Stage 2 the run team, Stage 3 the Year 1 team, Review the final number. Under them are the steps of the stage you are in. A green dot means a step is ready, an amber dot means it still needs a choice (hover for what), a hollow dot means optional. The bar stays on screen as you scroll, with Previous and Next arrows at its right.</li>
</ul>
<div class="quiz" data-quiz="welcome"></div>`,
quiz:[
 {q:"The base team is 8 FTE and the work team (without AI engineers) is 12 FTE. What is the delivery team before SDM?",o:["20 FTE: they are added","12 FTE: the larger one","8 FTE: the base team is the floor"],a:1,why:"The two are compared, not added. The work team's people staff the shifts as part of doing the work."},
 {q:"Where do rates and price come in?",o:["Step 11","Step 13","Not in this tool: it sizes FTE only"],a:2,why:"The tool produces FTE by role, grade and location. Pricing happens in the pricing sheet."}
]},

{id:"prep",grp:"Start here",t:"Before you start",html:()=>`
<span class="eyebrow">Start here · 5 min</span>
<h1>What to gather before you start</h1>
<p class="lead">You can start with nothing and fill in as you learn, but these inputs move the number most. Tick what you have; your list is remembered in this browser.</p>
<ul class="check" id="prepList"></ul>
<div class="tip"><b>No ticket history?</b> That's normal early on. Step 2 falls back to estate size (T-shirt sizing) and then to monthly active users. The confidence score in Step 8 will say how much that weakens the estimate.</div>
<h2>How long it takes</h2>
<p>About 20–30 minutes for a first pass with two or three towers, less if you start from documents on step 0. A deal review walk-through of a finished estimate takes 10 minutes using the stage results and the summary document.</p>`},

{id:"docs",grp:"Start here",t:"Step 0 · Documents",html:()=>`
<span class="eyebrow">Step 0 · optional</span>
<h1>Start from documents with Extract inputs</h1>
<p class="lead">Upload what you have and Claude proposes inputs for every stage, each with the quote it came from. Nothing changes until you choose what to apply.</p>
<ol class="steps">
<li><div>Add files to the four cards: <span class="ui">RFP</span>, <span class="ui">Incident dump</span>, <span class="ui">Meeting notes</span>, <span class="ui">Others</span>. PDF, Word, text, Excel and CSV work; you can also paste text.</div></li>
<li><div>An incident dump (ITSM export) is <b>summarised in your browser</b>: tickets a month, priority mix, top groups. Only the summary is sent to Claude, not the raw export.</div></li>
<li><div>Enter the <b>passphrase</b> (ask the tool owner) and click <span class="ui">Extract inputs</span>. It takes 30–90 seconds for a typical RFP when the AI reads your documents; a Prism Library reference sheet is read instantly, with no passphrase.</div></li>
<li><div>If a proposed tower is the same kind as one you already have, the proposal asks whether to <b>update</b> your tower (only the fields it lists change) or <b>add a new tower</b>. Update is the default. Choose a new tower only when the deal really has a second, separate estate of that kind.</div></li>
<li><div>A pasted <b>Prism Library reference sheet</b> is read directly, without the AI: its tower, tickets, coverage, term and assumptions are proposed. It describes another deal, so check each proposal.</div></li>
<li><div>Review <span class="ui">Proposed inputs</span>, grouped by stage. Untick anything you don't agree with, then <span class="ui">Apply selected and go to Step 1</span>.</div></li>
</ol>
<h2>Choose how to size the deal</h2>
<p>Below the extraction panels, <span class="ui">Choose how to size this deal</span> offers two methods: <b>Service tower based</b> (the steps in this guide) and <b>Bottom-up (activity based)</b>, which sizes from the RFP's activities. The cards show what the documents listed. You can change the choice at any time from <span class="ui">File, Sizing method</span>.</p>
<h2>What Claude can propose</h2>
<p>Deal name; coverage window and P1s a month; towers with who provides L1/L2/L3, SLAs, priority mix, ticket volumes (and where they're counted) or estate size, enhancements, L1.5, SRE and AIOps scope, special roles; AI adoption; complexity; term; existing team; contract clauses and the towers that serve them; assumptions, risks and open questions for the client.</p>
<div class="note"><b>Where the inputs came from</b> Every applied input keeps its source and quote. It shows under the coverage window, on each tower card, and in Step 13's <span class="ui">Where the inputs came from</span> table. If someone edits it later it's flagged <i>edited since</i>.</div>
<div class="warn"><b>Always check the proposals</b> Claude only proposes what the documents support, but it can misread a table. Applied risks arrive switched off at 0%, and open questions become Step 1 assumptions to confirm with the client.</div>
${tryTool(0,"Drop in an RFP and see what it proposes.")}
<div class="quiz" data-quiz="docs"></div>`,
quiz:[
 {q:"What happens to the raw incident export?",o:["It's uploaded to Claude as-is","It's summarised in your browser; only the summary is sent","It's stored on the server"],a:1,why:"The browser computes monthly volumes, priority mix and top groups, and sends only that summary."},
 {q:"You apply a proposed risk from the documents. What FTE effect does it have?",o:["Its suggested % immediately","None until you switch it on and set a %","It doubles the contingency"],a:1,why:"Imported risks arrive switched off at 0%, so the deal team decides the modifier."}
]},

{id:"pairing",grp:"Start here",t:"Pairing on a deal",html:()=>`
<span class="eyebrow">Start here · 3 min</span>
<h1>Two SAs, one deal</h1>
<p class="lead">When two of you work the same deal, save the estimate to the server and share it. Your work normally lives in your own browser, so your partner cannot see it until you do this.</p>
<h2>You share it</h2>
<ol class="steps">
<li><div>Sign in and give the deal a name at the top.</div></li>
<li><div>Type the deal name at the top, then <span class="ui">File, Save to server</span>. A new name is saved as a new deal. A banner shows the version.</div></li>
<li><div><span class="ui">File, Open from server</span>, then <span class="ui">Share…</span> on your estimate.</div></li>
<li><div>Type your partner's work email and press <span class="ui">Add</span>. They need a Prism account first. If they have none, ask an administrator.</div></li>
<li><div>Choose <b>edit</b> if you both change the estimate. Choose <b>view</b> if your partner only reviews it.</div></li>
<li><div>Press <span class="ui">Save sharing</span>. The button shows how many people you are sharing with.</div></li>
<li><div><b>Message your partner.</b> Prism does not notify them.</div></li>
</ol>
<h2>Which deal does a save go to?</h2>
<ul>
<li><b>A name no deal has:</b> saved as a new deal, with no question.</li>
<li><b>You changed the name</b> of the deal you have open: saved as a new deal. The old one is left as it is.</li>
<li><b>The same name</b> as a deal on the server: Prism asks. <span class="ui">New version</span> replaces what is saved in that deal. <span class="ui">New deal</span> makes a separate one with the same name. Case and extra spaces do not matter.</li>
<li><b>No name:</b> not saved. Name the deal first.</li>
<li>A <b>version</b> only counts saves. The saved copy is replaced and older versions are not kept, so use <span class="ui">File, Save file</span> to keep a copy you may want back.</li>
<li><span class="ui">Reset estimate</span> starts a blank estimate, so its next save is a new deal.</li>
</ul>
<h2>Your partner opens it</h2>
<ol class="steps">
<li><div>Sign in, then <span class="ui">File, Open from server</span>. Type the deal name or the owner's email in the filter if the list is long.</div></li>
<li><div>Click <span class="ui">Open</span> on the shared estimate.</div></li>
<li><div>With <b>edit</b>, change it and use <span class="ui">File, Save to server</span>.</div></li>
<li><div>With <b>view</b>, a banner says "View only" and nothing you type is kept. <span class="ui">Save a copy to my estimates</span> gives you your own copy to change.</div></li>
</ol>
<h2>Working on the same deal without losing work</h2>
<ul>
<li><b>Agree who is editing.</b> Prism does not merge two people's changes and there is no live editing together.</li>
<li><b>Save before you hand over,</b> then tell your partner. They <b>open it from the server again</b> to get the latest, because an estimate they already have open does not update by itself.</li>
<li><b>If a save is stopped</b> with "saved a newer version first", someone saved after you opened it. Open their version. To keep your own changes too, use <span class="ui">File, Save file</span> first, then open theirs and re-enter your changes.</li>
<li>The latest saved copy is the one that counts. There is no version history.</li>
</ul>
<div class="note"><b>Good to know</b> Only the owner of an estimate or an administrator can share or delete it. Someone with edit access can change it but cannot pass it on. A <b>viewer</b> account can open shared estimates but cannot save. Work you never saved to the server stays only in your own browser, and <span class="ui">File, Save file</span> still gives you a copy on your computer. The <a href="#signin" data-go="signin">Signing in and roles</a> chapter has the roles.</div>
<div class="tip"><b>First time?</b> Try it with your partner on a throwaway deal before a real one: one of you saves and shares, the other opens it, changes it and saves, then the first re-opens it.</div>`},
{id:"clauses",grp:"Start here",t:"Contract clauses",html:()=>`
<span class="eyebrow">Optional · between Step 0 and Step 1</span>
<h1>Trace the team back to the contract</h1>
<p class="lead">A reviewer or client often asks why a role is in the team. This screen lets you answer in contract terms: list the clauses that decide the size or scope of the run team, link each to the towers that serve it, and read how much of the Year 1 team each clause accounts for.</p>
<div class="note"><b>It explains the number. It never changes it.</b> Clauses group the team that Stages 1 to 3 already built. Adding, editing or removing a clause leaves every FTE as it was.</div>
<h2>How to use it</h2>
<ol class="steps">
<li><div>Open <span class="ui">Contract clauses</span> from the Documents screen (<span class="ui">Next: contract clauses</span>). The screen is optional; you can skip it with <span class="ui">Skip to step 1</span>.</div></li>
<li><div>Click <span class="ui">+ Add a clause</span> and fill in the <b>reference</b> (for example "2.1"), <b>What it requires</b> and <b>Target or SLA</b>. You can add up to 25.</div></li>
<li><div>Or let Claude propose them. <span class="ui">Extract inputs</span> on the Documents screen returns clauses with the quote each came from, and the clause references each tower serves. They appear in the proposals list. Untick any you don't agree with. After you apply them, the Clauses screen opens so you can check the links.</div></li>
<li><div><b>Link each clause to its towers</b> by ticking them on this screen. Step 2 has the same choice on every tower under <span class="ui">Contract clauses served</span>. A tower can serve several clauses. A clause with no tower is flagged as not linked, and no FTE is tied to it.</div></li>
<li><div>Go to <b>Step 9, Team shape: Year 1</b>. The <b>FTE by contract clause</b> table splits each tower's Year 1 FTE equally across the clauses it is linked to.</div></li>
</ol>
<h2>Reading the table</h2>
<div class="tbl"><table><thead><tr><th>Row</th><th>What it means</th></tr></thead><tbody>
<tr><td>A clause</td><td>The FTE of the towers linked to it, shared equally where a tower serves more than one clause</td></tr>
<tr><td>Shared roles</td><td>Roles that belong to no single tower: shift cover, transformation capacity, delivery managers</td></tr>
<tr><td>Not linked to a clause</td><td>A tower you have not linked to any clause yet</td></tr>
<tr><td>Tie-out check</td><td>Confirms the rows add up to the Year 1 team. If they don't, it shows an error</td></tr>
</tbody></table></div>
<div class="warn"><b>Limits to know</b> The split is equal, so it is a way to explain the team, not a price per clause. The last year of the term is shown as an approximation: the tool keeps FTE by tower for Year 1 only, so it applies the Year 1 split to that year's team. A proposed final number from Step 14 is not split by clause.</div>
<h2>Where clauses appear</h2>
<p>They are saved in the estimate file, in the Excel export (a <b>Contract clauses</b> sheet) and in both summaries. Estimates saved before this screen existed open with no clauses.</p>
<div class="tip"><b>Links are never guessed</b> Extraction links a tower only to a clause reference that exists in the list. If a link is missing, tick it yourself.</div>`},

{id:"bu",grp:"Bottom-up method",t:"Bottom-up (activity based)",html:()=>`
<span class="eyebrow">A second way to size a deal</span>
<h1>Size the deal from its activities</h1>
<p class="lead">The tower method starts from tickets and service towers. The bottom-up method starts from the list of activities in the RFP. Each activity has hours a month, an automation lever and the roles that do the work. The team is those hours turned into FTE, year by year.</p>
<div class="note"><b>It has its own engine and steps.</b> Choose it on the Documents screen (<span class="ui">Choose how to size this deal</span>) or from <span class="ui">File, Sizing method</span>. The activities, drivers, use cases and role floors belong to bottom-up alone, so switching deletes nothing. The support window, locations, complexity, contingency, manager ratio and existing team are <b>shared</b> with the tower method: enter them once, and a change in either method changes both.</div>
<h2>The seven steps</h2>
<div class="tbl"><table><thead><tr><th>Step</th><th>What you do</th></tr></thead><tbody>
<tr><td>1 · Coverage and locations</td><td>The same screen as the tower method's Step 1: the support window, delivery locations, on-call and leave. Its "Step 1 base team" becomes the coverage floor.</td></tr>
<tr><td>2 · Scope and drivers</td><td>Set the core term and option years, the scenario, productive hours per FTE, hypercare, the rounding step and whether AI build is a separate team. Add the volume drivers with their yearly growth, adjust the realisation curve, switch the coverage floor and backfill on or off, set each role's tier, and set role floors.</td></tr>
<tr><td>3 · RFP activities</td><td>One card per activity: tower, RFP reference, layer, driver or quantity, times a month, hours per unit, maximum lever, years, scaling, roles and the use cases behind the lever. Add from the starter library or by hand.</td></tr>
<tr><td>4 · Use cases and automation</td><td>Switch on the use cases from the catalogue, set the year each starts and edit its build days. Hours released by each use case are shown beside it.</td></tr>
<tr><td>5 · Complexity, managers and grade mix</td><td>Choose the engagement complexity, which sets the contingency and the grade pyramid. Set how managers are sized. Rate the confidence drivers for an advisory contingency guide.</td></tr>
<tr><td>6 · Roles and FTE</td><td>FTE by role for every year, then the coverage floor, grade mix, team by location, what moves the team each year, and the layers and skills behind it.</td></tr>
<tr><td>7 · Review and export</td><td>The result, the existing-team check, 18 checks, the saving after the cost of running the AI layer, and traceability to each RFP reference. Download the bottom-up workbook as CSV.</td></tr>
</tbody></table></div>
<h2>The formulas</h2>
<ul>
<li><b>Baseline hours a month</b> = quantity × times a month × hours per unit.</li>
<li><b>Hours in year n</b> = baseline × scaling × (1 − lever × realisation × efficiency), only between the activity's from and to years.</li>
<li><b>Hours released</b> = baseline × scaling × lever × realisation × efficiency.</li>
<li><b>Scaling</b> multiplies by (1 + growth) from Year 2, using the driver's growth or the partner footprint growth. Fixed activities do not scale.</li>
<li><b>Lever</b> = the activity's maximum lever × the share of its use cases that are switched on and live that year. An activity with a lever but no use case releases nothing.</li>
<li><b>FTE</b> = hours a month ÷ productive hours per FTE a month, then rounded up to the step for each role, with the role's floor as a minimum.</li>
</ul>
<h2>Coverage, managers and contingency</h2>
<p>These follow the tower method's own rules, in the same order. Each has a switch in step 2 or 5. A new estimate has them on. A bottom-up estimate saved before they existed has them off, so its numbers do not move.</p>
<ul>
<li><b>Role tiers.</b> Each role is L2, L3 or other, guessed from its name and editable. L2 and L3 roles staff the shifts. Managers and AI, data, release, security and database roles are guessed as other.</li>
<li><b>Leave and holiday backfill</b> raises the L2 and L3 hours by each location's leave and public holidays, weighted by its share of the support window.</li>
<li><b>Coverage floor.</b> The support window needs at least the "Step 1 base team". If the L2 and L3 roles come to less, the gap is added as L2 and L3 in the window's own ratio. It stays when automation cuts hours.</li>
<li><b>Managers.</b> One service delivery manager per set number of delivery FTE (default 12). The default, automatic, adds it unless an activity already gives a delivery lead, so the lead is never counted twice. You can also force the ratio or take managers from the activities only.</li>
<li><b>Contingency</b> is a percentage of the delivery team plus the manager: low 5%, medium 7.5%, high 10% in Year 1 (or your own), and the lower of that and 6% after. No complexity means no contingency.</li>
<li><b>Grade mix</b> splits the delivery team, contingency and manager into Lead, Senior and Consultant with the complexity's pyramid. It is a view and does not change the FTE.</li>
</ul>
<div class="calc" id="calcBU">
  <h3>Try it: one activity from quantity to FTE</h3>
  <div class="sub">Same formula as the tool, for one activity in one year. The tool's default efficiency is 90%.</div>
  <div class="grid">
    <label>Quantity<input id="buQ" type="number" min="0" value="100"></label>
    <label>Times a month<input id="buF" type="number" min="0" value="2"></label>
    <label>Hours per unit<input id="buH" type="number" min="0" step="0.1" value="1.4"></label>
    <label>Maximum lever, %<input id="buL" type="number" min="0" max="100" value="50"></label>
    <label>Realisation this year, %<input id="buR" type="number" min="0" max="100" value="30"></label>
    <label>Efficiency, %<input id="buE" type="number" min="0" max="100" value="100"></label>
    <label>Productive hours per FTE a month<input id="buP" type="number" min="20" value="140"></label>
  </div>
  <div class="out" id="buOut"></div>
</div>
<div class="tip"><b>A worked check</b> 100 × 2 × 1.4 = 280 hours a month. With a 50% lever, 30% realisation and 100% efficiency: 238 hours, 42 released, 1.70 FTE, which rounds up to 2.0 at a 0.5 step.</div>
<h2>Use cases and the catalogue</h2>
<p>The catalogue has 29 use cases with a build effort range, duration and token cost for each. Effort is the range midpoint unless you edit it. A use case costs its build days in the year it starts, plus a one-time AI foundation build in Year 1. Hours are released from the activities that tick the use case, split equally across the ones that are live. A use case that needs another (for example the monthly report needs the dashboard) is flagged if the other is off.</p>
<h2>What moves the team each year</h2>
<p>Step 4 splits each year's change into volume growth, more automation, activities starting or ending, hypercare ending, AI build, and floors and rounding. They add up to the change in the team.</p>
<h2>Start from documents</h2>
<p>With bottom-up on, <span class="ui">Extract inputs</span> also proposes the activities the RFP lists, the option years, and any use case the documents ask for. It matches each activity to a starter library entry when one fits closely and takes quantities only when the documents state them. It never estimates hours: an activity with no library match arrives with no hours and the checks flag it.</p>
<div class="warn"><b>Limits to know</b> The starter library values, the realisation curves, the efficiency factor, hypercare, the foundation build and the catalogue effort are proposed values, not framework values. This method does not feed Stages 2 and 3 of the tower flow, has no Prism Library hand-off yet, no 24-month ramp, no risk registers and no skill cover by shift. The confidence guide uses your ratings only; the tower derives suggestions from its towers. The tower summaries and Excel export are for the tower method only.</div>`},

{id:"s1",grp:"Stage 1 · Size the team",t:"Step 1 · Coverage",html:()=>`
<span class="eyebrow">Stage 1 · Step 1</span>
<h1>Base team from coverage windows and locations</h1>
<p class="lead">How many people it takes to keep someone on duty in every hour of the support window, whatever the ticket volume, given when each delivery location actually works.</p>
<ol class="steps">
<li><div>Say <b>where the customer is</b>: the region, the location and its <b>time zone</b> as a UTC offset. This only sets the clock for the strip, the timeline and the reports.</div></li>
<li><div>Pick the <b>geographies to cover</b>, even if the customer is in one place. Each has its own <b>local start</b> and hours a day (09:00 to 18:00 to begin). The customer's own region does not have to be one of them.</div></li>
<li><div>The tool merges the geographies into one <b>combined window</b> on the customer's clock. Hours where two geographies are open count once, and the people on duty are one shared pool.</div></li>
<li><div>Turn on <b>Shift limits</b> if delivery locations must not work early or late (for example no earlier than 06:30 and no later than 21:00 local). Best fit then keeps every shift inside them.</div></li>
<li><div>Open <b>Best coverage for these locations</b> and choose a strategy. <span class="ui">Cost optimized</span> uses India for most hours and adds other locations only where needed. <span class="ui">Local coverage</span> serves each geography from a location in or near it. The table compares the layouts (uncovered hours, overlap, hours outside 09:00 to 18:00 local, India's share, base team). Each location works at most the <b>longest window</b> you set (9 hours to start), so a long support window needs more locations and any hour left over shows as uncovered. Press <span class="ui">Apply</span> on one. It says which delivery locations it adds or removes. No shift runs outside the shift limits.</div></li>
<li><div>Read <b>Gaps and how to close them</b>. It lists hours nobody covers and the delivery locations that would close them. Press <span class="ui">Add</span> to add one.</div></li>
<li><div>Pick the <b>support window</b> (<span class="ui">24x5</span>, <span class="ui">16x7</span> …) and the time it <b>starts</b>. The window is on the customer's clock.</div></li>
<li><div>Set <b>people on duty</b> (L2 and L3). The framework minimum is one each.</div></li>
<li><div>Tick the <b>delivery locations</b> offered for the region: Europe offers EU (onshore), Romania (nearshore) and India (offshore); APAC offers Singapore, Australia, China and India (offshore); North America offers LATAM, Ecuador, Brazil (nearshore) and India (offshore); IME offers India only. Leave and public holidays are editable per location.</div></li>
<li><div>Choose <b>Support asked for</b> at the top of the support window: <span class="ui">Active–active</span> staffs every hour in each location's working hours; <span class="ui">Active–passive (P1 on call)</span> staffs each location's daytime and covers the rest on call for P1. This lays out the windows below, which you can then edit.</div></li>
<li><div>Give each location its <b>working windows in its own local time</b>. A window is <span class="ui">Active</span> (people working) or <span class="ui">On-call (P1)</span> (reachable for critical incidents only). <span class="ui">Best fit to local daytime</span> hands each half hour of the support window to the selected location where it is closest to 13:00 local, so the window follows the sun; <span class="ui">Best fit, nights on call</span> also marks hours outside 07:00–20:00 local as P1 on call; <span class="ui">Lay out evenly</span> splits the window into equal slices. Each location also has <span class="ui">Day</span>, <span class="ui">Late</span> and <span class="ui">Night</span> buttons that add a 09:00–18:00, 12:00–21:00 or 21:00–05:00 local window.</div></li>
<li><div>Watch the <b>live coverage strip</b> pinned above the inputs: it redraws as you change a window, so a gap or overlap appears while you type. Then read the full <b>coverage timeline</b> below: one row per location, local clock times in every cell, green for active, orange for on call. It shows how many window hours are active, how many are on call only, any hours nobody covers, and where two locations overlap.</div></li>
<li><div>Choose the <b>on-call allowance</b>: a flat % (default 15%), or <span class="ui">From P1 volume</span>: 10% standby plus P1s a month × hours per call-out ÷ 728 hours.</div></li>
<li><div>The tool divides by 85% utilisation and adds leave and holiday backfill per location.</div></li>
</ol>
<div class="note"><b>Example</b> Customer in Minneapolis (UTC−5), 24×5. Ecuador works 09:00–19:00 local. India works 09:30–19:30 and is on call 05:30–09:30 local. On the customer's clock India is active 23:00–09:00 and on call 19:00–23:00, so 20 hours are active, 4 are on call only, nothing is uncovered and nothing overlaps.</div>
<div class="calc" id="calcCov">
  <h3>Try it: coverage roster</h3>
  <div class="sub">Same formula as the tool, before utilisation and leave: roster = (staffed hours a week × people on duty) ÷ contracted hours, [F] p.3 worked in hours.</div>
  <div class="grid">
    <label>Hours a day<select id="cvH"><option>8</option><option>16</option><option selected>24</option></select></label>
    <label>Days a week<select id="cvD"><option selected>5</option><option>7</option></select></label>
    <label>People on duty (L2 + L3)<input id="cvC" type="number" min="1" max="10" value="2"></label>
    <label>Hours a day on call only<select id="cvK"></select></label>
    <label>On-call allowance %<input id="cvO" type="number" min="0" max="100" value="15"></label>
  </div>
  <div class="out" id="cvOut"></div>
</div>
<div class="tip"><b>Check yourself against the framework</b> 24×5 with 2 people on duty and no on-call gives (120 h × 2) ÷ 40 = 6.0 FTE: the framework's own p.3 example.</div>
<div class="note"><b>Overlap is paid for</b> Hours where two locations are both active (a handover cushion) are staffed twice and counted in the roster. The timeline shows them so you can decide whether the cushion is worth it. Hours worked outside the support window are counted too.</div>
${tryTool(1,"Set the coverage windows and watch the timeline and the bar at the bottom.")}
<div class="quiz" data-quiz="s1"></div>`,
quiz:[
 {q:"A window switched from Active to On-call (P1) counts as…",o:["A fully staffed window","Nothing","The on-call allowance % of a staffed window"],a:2,why:"On-call windows count at the allowance, 15% by default, or standby plus P1 workload if you size it from P1 volume."},
 {q:"Does ticket volume change the base team?",o:["Yes","No"],a:1,why:"The base team only answers 'is every hour covered?'. Volume drives the work team in step 2."},
 {q:"India and Ecuador are both active from 14:00 to 16:00 on the customer's clock. How is that counted?",o:["Once","Twice: both teams are staffed","Not at all"],a:1,why:"Overlap is a handover cushion. Both locations are staffed, so both are counted; the timeline shows the overlap hours."}
]},

{id:"s2",grp:"Stage 1 · Size the team",t:"Step 2 · Service towers",html:()=>`
<span class="eyebrow">Stage 1 · Step 2</span>
<h1>Service towers: demand and service levels</h1>
<p class="lead">Add an <b>AMS</b>, <b>IMS</b>, <b>DMS</b> or <b>AI platforms</b> tower for each estate in scope. Each tower turns demand into effort and FTE. Special roles are added in Step 5; until then the tower's default role takes all of its FTE.</p>
<h2>For each tower, top to bottom</h2>
<p>AMS and DMS towers first ask <b>Proceed with volumetrics or thin slices?</b> Thin slices size the tower from its applications (AMS) or data products (DMS) by criticality: Critical, Important and Standard, each carrying a fixed FTE per slice from Benchmarks (<code>proposed</code>, editable). The basis you choose drives the number; if you fill in the other as well, it shows as a cross-check and is flagged when it is more than 25% away. IMS and AI towers use volumetrics only. A tower sized from thin slices does not count towards volumetrics being available for the transformation scenario.</p>
<ol class="steps">
<li><div><b>Who provides each support level.</b> Presets: <span class="ui">Client L1 · us L2 + L3</span> (default), <span class="ui">Us L1–L3</span>, <span class="ui">Us L2 only</span>, <span class="ui">Us L3 only</span>, or pick per level. Only our levels are sized. Every change of owner between adjacent levels adds <b>4% coordination</b> to our ticket effort.</div></li>
<li><div><b>Service levels (SLA), optional.</b> P1/P2 response and restore, availability class, or <span class="ui">Gold</span> / <span class="ui">Silver</span> / <span class="ui">Bronze</span>. Stringent targets add effort on L2/L3 ([F] Sc.3 Step 2), capped at 40%. </div></li>
<li><div><b>Demand, in order.</b> Ticket history if the client has it: <b>incidents, service requests and change requests a month</b>. Incidents are split by <b>severity</b> (P1 to P4, counts or %; with counts at L1 the mix sends P1/P2 straight to L2/L3) and counted at L1, L2 or L3. Service requests and change requests are each split by <b>complexity</b> (Low / Medium / High, counts or %): SRs are costed by complexity and done by L1 (Low), L2 (Medium) or L3 (High); CRs are planned engineering work on L3 (or L2). The AREs are in the Benchmarks panel. If not, the estate's structural complexity (T-shirt sizing for apps, environments/DBs for IMS, pipelines for DMS, agents/models for AI). If not even that, monthly active users.</div></li>
<li><div><b>Enhancement pool</b> (optional hours a month, separate from change requests) and <b>estate</b> (modern or complex legacy: 25% or 35% non-ticketing effort).</div></li>
<li><div><b>L1.5, SRE and AIOps</b>: each tower asks whether they are in scope. SRE (any tower kind): you type the SRE FTE, carved out of that tower's L3, a role-mix change, not extra headcount. L1.5: you type the Product Support Engineer FTE, carved out of that tower's L2.  AIOps brings the AI engineers.</div></li>
<li><div><b>Special roles</b> are not entered on the tower: they live in Step 5 (Skill type), together with the skills required on each shift.</div></li>
<li><div><b>AIOps</b>: if in scope, AI engineers are added at 1 per 4 support FTE (low AI adoption) or 1 per 8 (moderate; 1:6 above 20 FTE). They are counted in Stage 3 as transformation capacity, inside the POD.</div></li>
<li><div><b>Contract clauses served</b> (optional): tick the clauses this tower serves. This only feeds the by-clause table in Step 9 and never changes the tower's FTE. See <b>Contract clauses</b>.</div></li>
<li><div><b>Default role</b>: every tower has one and it takes the tower's FTE: System Support Engineer for AMS, Infra Support Engineer for IMS, Data Ops Engineer for DMS, AIOps Engineer for agentic (AI platform). The base roster covers it on every shift.</div></li>
</ol>
<div class="flow"><span>Tickets a month</span><i>→</i><span>L1 30% resolved · L2 70% · L3 = L2 × 20%</span><i>→</i><span>hours: L1 0.25 · L2 3 · L3 10, + SLA, + coordination</span><i>→</i><span>÷ 85% utilisation</span><i>→</i><span>+ B non-ticketing 25/35%</span><i>→</i><span>÷ 160 h = FTE</span></div>
<div class="calc" id="calcTw">
  <h3>Try it: one tower from tickets to FTE</h3>
  <div class="sub">Same formula as the tool (before leave backfill and risk).</div>
  <div class="grid">
    <label>Tickets a month<input id="twT" type="number" min="0" value="100"></label>
    <label>Counts measured at<select id="twL"><option value="l1">All tickets (L1)</option><option value="l2">Tickets reaching L2</option></select></label>
    <label>Who provides<select id="twO"><option value="cl1">Client L1 · us L2 + L3</option><option value="full">Us L1–L3</option><option value="l2">Us L2 only</option><option value="l3">Us L3 only</option></select></label>
    <label>SLA preset<select id="twS"><option value="none">None entered</option><option value="bronze">Bronze</option><option value="silver">Silver</option><option value="gold">Gold</option></select></label>
    <label>Estate<select id="twE"><option value="modern">Modern (B 25%)</option><option value="legacy">Complex legacy (B 35%)</option></select></label>
  </div>
  <div class="out" id="twOut"></div>
</div>
<div class="tip"><b>The framework's worked example</b> 100 tickets at L1, Us L1–L3, no SLA, modern: 30 / 70 / 14 tickets, 420.6 hours, 3.29 FTE.</div>
${tryTool(2,"Add a tower and answer its questions top to bottom.")}
<div class="quiz" data-quiz="s2"></div>`,
quiz:[
 {q:"The client's ITSM export has every ticket raised. Where are the counts measured?",o:["All tickets (L1)","Tickets reaching L2","Tickets reaching L3"],a:0,why:"A whole-queue export is L1 inflow; 70% passes to L2. An incumbent's L2 queue would be 'reaching L2'."},
 {q:"We provide L2 only, the client runs L1 and another supplier runs L3. What coordination uplift applies?",o:["0%","4%","8%"],a:2,why:"Two interfaces (L1→L2 and L2→L3) with different owners, 4% each."},
 {q:"SRE is set to Yes on a tower. What happens to headcount?",o:["It adds SREs on top","It doesn't change; the SRE FTE you type is carved out of that tower's L3","It removes L2"],a:1,why:"SRE changes who does the L3 work, not how much work there is."}
]},

{id:"s9",grp:"Stage 1 · Size the team",t:"Step 3 · Current team (reference range)",html:()=>`
<span class="eyebrow">Stage 1 · Step 3</span>
<h1>Current team: a reference range</h1>
<p class="lead">Three independent views of the same team: what the ticket volume needs, what the support window needs, and what the client runs today. The Stage 1 number is still the larger of the first two. The existing team is shown as a <b>reference range</b> (today's team ± the tolerance), the cross-check that tells you whether to trust it. It flags when it binds; it never drives the number.</p>
<ol class="steps">
<li><div>Enter the <b>existing team</b> by tier (L2, L3, SRE / automation, managers, other), where the numbers came from, and the <b>tolerance</b> that counts as consistent (default ±10%).</div></li>
<li><div>Read the <b>three bars</b>: ticket volume (step 2, without AI engineers), base team (step 1) and existing team (L2 + L3 + SRE / automation), next to our Stage 1 support team.</div></li>
<li><div>Read the <b>verdict</b>: it says which of ticket volume and coverage sets the number, whether the existing team agrees, and how far apart the three views are.</div></li>
</ol>
<div class="note"><b>The existing team never changes the number</b> It is a reference range of today's team ± the tolerance, and the verdict says whether our number sits below, inside or above it. It is evidence, not an input to the calculation. If it is far above ours, check scope, the window it covers and hidden capacity. If it is far below, check for out-of-scope work in today's team before presenting a saving.</div>
<div class="tip"><b>Two places for the fact check</b> This step checks the Stage 1 team against today. Step 13 checks the final Year 1 team, and each year of the term, against the same numbers.</div>
${tryTool(9,"Enter the existing team and read the verdict.")}
<div class="quiz" data-quiz="s9"></div>`,
quiz:[
 {q:"The existing team is 30% below our Stage 1 support team. What does the tool do to the number?",o:["Lowers it to match","Nothing: it flags the gap for you to explain","Raises the contingency"],a:1,why:"The existing team is a cross-check. The Stage 1 number stays the larger of the ticket-volume and base teams."},
 {q:"Which three views are triangulated?",o:["Ticket volume, base team, existing team","Base team, SDM, contingency","Incidents, requests, changes"],a:0,why:"Ticket volume (work team), the support window (base team) and the team the client runs today."}
]},

{id:"s5",grp:"Stage 1 · Size the team",t:"Step 4 · Required team size",html:()=>`
<span class="eyebrow">Stage 1 · Step 4</span>
<h1>Required team size: reconcile and SDM</h1>
<p class="lead">This is where the two teams meet. The larger one is kept and Service Delivery Managers are added at 1 per 12 delivery FTE. The result is the <b>Stage 1 team</b>: the number Stage 2 tests. The step also states the <b>binding dimension</b>: coverage when the support window sets the size, ticket volume when the work does.</p>
<div class="calc" id="calcRe">
  <h3>Try it: base vs work</h3>
  <div class="grid">
    <label>Base team (Step 1)<input id="reB" type="number" min="0" step="0.1" value="8.65"></label>
    <label>Work team from the towers<input id="reW" type="number" min="0" step="0.1" value="5.5"></label>
    <label>SDM ratio (1 per)<input id="reS" type="number" min="1" value="12"></label>
  </div>
  <div class="out" id="reOut"></div>
</div>
<div class="note"><b>AI engineers come later</b> The AI engineers for towers with AIOps in scope build automation and don't staff shifts, so they are not part of the Stage 1 team. They join as transformation capacity in Stage 3 (Step 10).</div>
${tryTool(5,"See the comparison bars and the verdict sentence.")}`},

{id:"s3",grp:"Stage 2 · Qualify the team",t:"Step 5 · Skill type",html:()=>`
<span class="eyebrow">Stage 2 · Step 5</span>
<h1>Skill coverage: is the Stage 1 team enough?</h1>
<p class="lead">Each tower's default role is on every shift through the base roster. Anything else is a <b>special role</b> you type. You say which special roles are required on which shift, based on the working windows from Step 1; elsewhere they are on call. The step then says whether the Stage 1 team can carry that or needs more headcount.</p>
<ol class="steps">
<li><div>Add the <b>special roles</b> for each tower and type their FTE. Developer (AMS), Infra Engineer (IMS), Data Engineer (DMS) and AI/ML Engineer (agentic) come out of the tower's own L3 effort, so the total does not change. Quality Analyst, Business Analyst, Solution Architect and Mobile Developer are added on top of the tower.</div></li>
<li><div>In the <b>skills required on each shift</b> table, each row is a working window and each column a special role. Enter how many people must be <b>live</b> in that window; leave it blank for on call. A role with no entry is not tested for cover.</div></li>
<li><div>In the other windows it's <b>on call</b>, counted at 15% of a staffed window (editable).</div></li>
<li><div>The tool compares that <b>coverage floor</b> with the FTE the skill already has from step 2 and tops up only the gap.</div></li>
<li><div>The verdict card then compares the top-up with the <b>spare capacity</b> in the Stage 1 team (the base team above the work team). Spare capacity is used first; <b>additional headcount</b> is added only for what is still missing.</div></li>
</ol>
<div class="note"><b>Example</b> Database is live in one window only: floor ≈ 1.7 FTE. If step 2 gave it 0.5 FTE of work, the top-up is 1.2. If the Stage 1 team has 0.8 FTE spare, 0.4 FTE of headcount is added. If it already had 2.0 FTE of work, nothing is added.</div>
${tryTool(3,"Set live windows for a specialist skill and read the verdict.")}`},

{id:"s11",grp:"Stage 2 · Qualify the team",t:"Step 6 · Location distribution",html:()=>`
<span class="eyebrow">Stage 2 · Step 6</span>
<h1>Location distribution</h1>
<p class="lead">Where the Stage 2 team sits. It splits the run team across your delivery locations by their working windows in Coverage, so you can see who carries what and whether the hand-offs are covered.</p>
<ol class="steps">
<li><div>Read the <b>team by location</b> table: L2, L3 and SDM FTE for each location, with the share of the team and the people it rounds to.</div></li>
<li><div>Read the verdict: the <b>largest location's share</b> and the <b>handover overlap</b>, the hours a day when two locations are active at once. An overlap is a cushion that is staffed twice.</div></li>
<li><div>There is nothing to enter here. To move people, change the windows in Step 1, or the SDM location in Step 7.</div></li>
</ol>
<div class="note"><b>No FTE is added</b> This step only shows where the team sits. A team in one location is flagged: add a second location for follow-the-sun cover.</div>
${tryTool(11,"See the team by location and the overlap between them.")}`},

{id:"s12",grp:"Stage 2 · Qualify the team",t:"Step 7 · Managerial capacity",html:()=>`
<span class="eyebrow">Stage 2 · Step 7</span>
<h1>Managerial capacity</h1>
<p class="lead">Service Delivery Managers (SDM) and the tech lead. SDMs are sized at 1 per 12 delivery FTE (editable) and placed in one location; the tech lead is the pyramid's Lead share on L3.</p>
<ol class="steps">
<li><div>Set the <b>SDM ratio</b> and the <b>SDM location</b>.</div></li>
<li><div>The SDM is <b>re-based</b> on the delivery team after skill cover is added, so it can be higher than the Stage 1 SDM.</div></li>
<li><div>Read the <b>managerial capacity table</b>: SDMs, tech lead, and the delivery FTE each carries.</div></li>
</ol>
<div class="note"><b>Only the SDMs and the tech lead are Lead</b> L2 has no Lead, and Lead is never above Senior. The grade mix does not change headcount.</div>
${tryTool(12,"Set the SDM ratio and read the table.")}`},

{id:"s6",grp:"Stage 2 · Qualify the team",t:"Step 8 · Complexity, seniority and contingency",html:()=>`
<span class="eyebrow">Stage 2 · Step 8</span>
<h1>Complexity, seniority and contingency</h1>
<p class="lead">Complexity sets the grade pyramid (mix only, no headcount change) and the contingency: Low 5%, Medium 7.5%, High 10%. Contingency closes Stage 2, so the result is the <b>run team</b>: the team that runs the service, before any transformation capacity.</p>
<h2>Does the grade mix fit the windows?</h2>
<p>Seniority never changes headcount. A <b>low-complexity</b> estate leans on juniors (1:2:4, more Consultants); <b>medium</b> is 1:2:3; a <b>high-complexity</b> estate leans on seniors (1:2:2). The check card then asks for a minimum number of Leads or Seniors on duty in every staffed hour (default 1) and tells you whether the pyramid gives enough of them. If it is short, the tool flags it and does not add people: move the pyramid up, name seniors as on-call cover, or lower the requirement. <b>Only the SDMs and a tech lead on L3 are Lead</b>: L2 has Seniors and Consultants only, and Lead is never above Senior across the whole team, so on a small team the tech lead gives way and Consultants are lifted to Senior if the SDMs alone would outnumber the Seniors.</p>
<h2>Estimate confidence (Annexure 1)</h2>
<p>Nine drivers scored 1–5, weighted to a score out of 100. The tool suggests each score from what earlier steps know; override any with what the deal team has actually seen.</p>
<div class="tbl"><table><thead><tr><th>Driver</th><th class="r">Weight</th></tr></thead><tbody>
<tr><td>Ticket volumetrics and demand</td><td class="r">22</td></tr><tr><td>SLA/SLO tier</td><td class="r">15</td></tr><tr><td>Coverage model</td><td class="r">13</td></tr>
<tr><td>Portfolio complexity</td><td class="r">12</td></tr><tr><td>Transition and handoff</td><td class="r">10</td></tr><tr><td>Domain criticality</td><td class="r">10</td></tr>
<tr><td>Change intensity</td><td class="r">8</td></tr><tr><td>Tech stack and tooling</td><td class="r">6</td></tr><tr><td>AIOps maturity</td><td class="r">4</td></tr>
</tbody></table></div>
<p>Bands: <b>0–39 Low</b>, <b>40–59 Medium</b>, <b>60–79 High</b>, <b>80+ Highest</b>. Each has contingency guidance; the page flags when yours is outside it. Drivers scored 1–2 become <b>due diligence items</b>. The band also sets the low–high range shown in the Overall estimate.</p>
${tryTool(6,"Score the drivers honestly; the range follows.")}
<div class="quiz" data-quiz="s6"></div>`,
quiz:[
 {q:"Does changing the pyramid from 1:2:4 to 1:2:2 change the FTE?",o:["Yes","No, it changes the grade mix only"],a:1,why:"The pyramid decides Lead : Senior : Consultant shares of the same team."},
 {q:"A driver scored 2. What should happen?",o:["Nothing","It becomes a due diligence item or a commercial caveat","Contingency doubles"],a:1,why:"Annexure 1 Step 4: drivers scored 1–2 become explicit assessment items."}
]},

{id:"s13",grp:"Stage 2 · Qualify the team",t:"Step 9 · Team shape: Year 1",html:()=>`
<span class="eyebrow">Stage 2 · Step 9</span>
<h1>Team shape: Year 1</h1>
<p class="lead">The Year 1 team by role, from the DAMO roles guidance map. This is the screen where a solution architect reviews the team overall. It groups the same FTE by role; it never changes the number.</p>
<ol class="steps">
<li><div>Read the <b>team by role</b> table: the run team that Stages 1 and 2 qualified, beside the Year 1 team once Stage 3's transformation capacity is added, with each role's description and guidance from the map.</div></li>
<li><div>Each tower has <b>one default role</b>: <b>AMS</b> System Support Engineer; <b>IMS</b> Infra Support Engineer; <b>DMS</b> Data Ops Engineer; <b>agentic (AI platform)</b> AIOps Engineer (also the AI engineers where AIOps is in scope). Developer, Infra Engineer, Data Engineer and AI/ML Engineer appear only as special roles you type on a tower, carved out of its L3. Mobile Developer, Quality Analyst, Business Analyst and an extra Solution Architect are special roles added on top.</div></li>
<li><div>The <b>Solution Architect</b> is 10% of an FTE once per deal (0.8 hours of an 8-hour day), editable here, carved out of the core-stream roles (capped at 60% of them), so the total never changes.</div></li>
<li><div><b>Roles appear only where they are in scope, sized by what you type</b>: the Product Support Engineer FTE on a tower with L1.5 in scope (carved out of its L2), the SRE FTE on a tower with SRE in scope (carved out of its L3), the AI Engineer where AIOps is in scope. A Yes with no FTE typed shows no role. The transformation POD's automation and CI/CD work is its own Transformation engineers row. Quality Analyst, Business Analyst, Solution Architect and Mobile Developer come from the <b>Special roles</b> you add in Step 5.</div></li>
<li><div>If you listed contract clauses, the <b>FTE by contract clause</b> table shows how much of the Year 1 team each clause accounts for, with a tie-out check. It groups the same FTE and never changes it.</div></li>
</ol>
<div class="note"><b>The Year 1 column moves with Stage 3</b> It includes the AI engineers (AIOps) and the rest of the transformation capacity, so it changes as you answer Step 10. The Service Delivery Manager follows the ratio in Step 7 (default 1 per 12 FTE, as in the map).</div>
${tryTool(13,"Review the Year 1 team by role.")}`},

{id:"s4",grp:"Stage 3 · Transformation and productivity",t:"Step 10 · Transformation",html:()=>`
<span class="eyebrow">Stage 3 · Step 10</span>
<h1>Transformation capacity</h1>
<p class="lead">Stage 3 adds transformation capacity on top of the run team. Year 1 shows two lines: the run team and the transformation capacity.</p>
<p class="lead">The framework scenario is worked out, not picked: client AI adoption × whether volumetrics are available (towers sized from ticket history carry at least half the tower FTE).</p>
<div class="calc" id="calcSc">
  <h3>Try it: which scenario?</h3>
  <div class="grid">
    <label>Client AI adoption<select id="scA"><option value="low">Low</option><option value="moderate">Moderate</option></select></label>
    <label>Tower FTE from ticket history<select id="scV"><option value="0">Under 50%</option><option value="1">50% or more</option></select></label>
    <label>Support team from the work (FTE)<input id="scR" type="number" min="0" value="20"></label>
    <label>AI engineers (AIOps in scope)<input id="scAi" type="number" min="0" step="0.1" value="0"></label>
  </div>
  <div class="out" id="scOut"></div>
</div>
<p>Three answers move the result, all <code>proposed</code> and editable under Benchmarks. <b>Application life stage</b> and the client's <b>appetite</b> scale the POD share (growth 125%, steady 100%, sunset 50%; low appetite 50%, medium 100%, high 125%). <b>Clarity of improvement pathways</b> sets how much of the Year 2+ savings target is credited (clear 100%, partial 75%, unclear 50%). Unanswered means 100%, so nothing moves until you answer. A POD share typed by hand overrides the first two.</p>
<p>The Transformation POD covers SRE, automation, CI/CD and AI adoption. The AI engineers for towers with AIOps in scope (set in Step 2) sit inside the POD, so Step 10 adds only the part they don't already cover. AIOps is never counted twice.</p>
${tryTool(4,"Choose the client's AI adoption.")}
<div class="quiz" data-quiz="s4"></div>`,
quiz:[
 {q:"Moderate AI adoption, and 70% of tower FTE is from ticket history. Scenario?",o:["1","2","3","4"],a:3,why:"Moderate AI + volumetrics available = Scenario 4 (POD 20%+, AIOps 1:8)."},
 {q:"POD is 2.5 FTE and 4 AI engineers are already in it (AIOps in scope). What does Step 10 add?",o:["2.5","6.5","0"],a:2,why:"AI engineers sit inside the POD; they already exceed it, so nothing more is added."}
]},

{id:"s7",grp:"Stage 3 · Transformation and productivity",t:"Step 11 · Capacity ramp and savings",html:()=>`
<span class="eyebrow">Stage 3 · Step 11</span>
<h1>Capacity ramp: term, Year 2+ savings and transition</h1>
<p class="lead">Year 1 is the run team from Step 8 plus the transformation capacity from Step 10, shown as two lines, with the same two lines for every year of the term. From Year 2 the team shrinks; a longer term captures more of those years, so the average team per year falls.</p>
<h2>Two ways to work out savings</h2>
<div class="cols2">
  <div class="card"><h3>Scenario YoY %</h3>A flat % a year from Year 2 (Scenario 1/3: 13.5%, 2: 11%, 4: 17.5%), applied above the coverage floor. Simple and framework-aligned.</div>
  <div class="card"><h3>AIOps use cases</h3>The default when AIOps is in scope. Pick what the AI engineers build (14 use cases with build effort, deflection, start year and ramp); every use case goes live from Year 1 unless you change it for all or for one. The panel shows when each use case takes effect, a chart of the combined deflection over the years, and the FTE freed, net of the engineers and whether they can build it in time. If no tower has AIOps in scope, the scenario percentage is used instead.</div>
</div>
<div class="warn"><b>Heads-up</b> With the default seven use cases, the portfolio usually frees less than the scenario target, and can be less than the AI engineers it takes. The verdict panel shows the net figure; use it to challenge the AIOps ratio or the use-case list.</div>
<h2>Transition (optional)</h2>
<p>Knowledge-transfer weeks (team 50% present), parallel-run weeks (full team) and a transition manager, in FTE-months. It's a one-off before service start and is <b>not</b> added to the Year 1 team.</p>
${tryTool(7,"Choose the term and compare the 1–5 year table.")}`},

{id:"s14",grp:"Stage 3 · Transformation and productivity",t:"Step 12 · Team shape by year",html:()=>`
<span class="eyebrow">Stage 3 · Step 12</span>
<h1>Team shape by year</h1>
<p class="lead">The team by role for every year of the term, after the capacity ramp. Year 1 is the full team; later years scale every role with that year's team. The AI engineers (AIOps) stay through the build years and, with build only on (the default for new estimates), leave after the last one.</p>
<ol class="steps">
<li><div>Read the table by year, with the totals and the two lines underneath: the run team and the transformation capacity.</div></li>
<li><div>The transformation line is net of any AIOps savings, so it can fall below zero in later years.</div></li>
</ol>
<div class="tip"><b>Indicative, not a roster</b> It is a planning aid for the pricing sheet and the delivery plan. Change the term, savings or the cross-cutting ratios and it updates.</div>
${tryTool(14,"Read the team by role for every year of the term.")}`},

{id:"s8",grp:"Review and commercial",t:"Step 13 · Final fact check & approval",html:()=>`
<span class="eyebrow">Review · Step 13</span>
<h1>Final fact check, overall estimate and approval</h1>
<p class="lead">Compare the final team with the team running the estate today (entered at step 3), then read the Overall estimate the way a deal desk will.</p>
<div class="tip"><b>Commercial position is a separate step</b> The numbers on this step are the modelled ones. A proposed final number and the commercial options live in Step 14, which is optional and never changes steps 1 to 9.</div>
<h2>In the Overall estimate panel</h2>
<div class="tbl"><table><thead><tr><th>View</th><th>What to look for</th></tr></thead><tbody>
<tr><td>How each step built the team</td><td>The build-up from the base team to the Stage 1 team, then what skill cover, transformation, the SDM re-base and contingency added, with rounding and transition</td></tr>
<tr><td>Year 1 team by role</td><td>Every FTE traced to a role, tower or step; rows add up to the total</td></tr>
<tr><td>Allowances</td><td>Productive need → utilisation, leave, contingency, risk. The buffer % is what a deal desk asks about</td></tr>
<tr><td>Assumptions register</td><td>Every assumption from every step, grouped by category. Edit them in the step they belong to</td></tr>
<tr><td>Where the inputs came from</td><td>Document sources and quotes; anything edited after import</td></tr>
<tr><td>Deviations from the framework</td><td>Every benchmark you changed, with the framework value</td></tr>
</tbody></table></div>
<h2>Approval</h2>
<ol class="steps">
<li><div>Set <b>Version</b> and <b>Prepared by</b>, then status <span class="ui">Submitted for approval</span>.</div></li>
<li><div>The approver sets <span class="ui">Approved</span> and their name. The tool fingerprints every input.</div></li>
<li><div>If anything changes afterwards, the header badge and both summaries say <b>Changed since approval</b>.</div></li>
</ol>
<h2>Scenarios and checks</h2>
<p><span class="ui">Save current as a scenario</span>, change inputs (e.g. 24×7 instead of 16×5), save again, and tick to compare side by side. <span class="ui">Run checks</span> verifies the engine against the framework's worked examples and that this estimate adds up.</p>
${tryTool(8,"Read the allowances and run the checks.")}`},

{id:"s10",grp:"Review and commercial",t:"Step 14 · Commercial position",html:()=>`
<span class="eyebrow">Review · Step 14</span>
<h1>Commercial position</h1>
<p class="lead">Optional. Set a proposed final number for a client budget or to win on price, see the risks it creates, and see which commercial shape the data supports. Steps 1 to 9 stay as modelled.</p>
<h2>A proposed final number</h2>
<p>Tick <span class="ui">Adjust the final number</span> and choose how to set it: <b>Year 1 FTE</b> (type the number you want, for example 7 where the tool models 10; every later year moves by the same proportion), <b>% change</b> (a negative number adds capacity), or <b>Per year</b> (set each year yourself). Choose a <b>reason</b>: nothing changes until one is on record. The cut comes out of contingency first, then the delivery team (SDM included). The panel shows modelled against proposed by year and the implied utilisation, the risks the numbers create (the team runs hotter than planned, below the Step 1 base team, contingency used up, well below the existing team, relying on faster AI savings, scope unchanged while capacity falls) and mitigations you can tick, reword or add to.</p>
<p>The proposed number drives the client summary, which shows it and nothing else from this step, and the Excel workbook. The summary document keeps the modelled steps and adds this step with the reason, the risks and the mitigations. Step 13 and the Overall estimate always show the modelled numbers.</p>
<h2>Commercial options</h2>
<p>Four optional inputs (months of ticket history, a measurable baseline, the client's Year 1 budget ceiling, price pressure) feed a rating of four commercial shapes: <b>fixed fee</b>, <b>outcome-based terms</b> (as an add-on), <b>time and materials with a cap</b>, and an <b>assessment-led start</b>. It starts from the framework's recommendation for the scenario and adjusts for the data you have, with reasons, guardrails and what would move each option up. If the budget ceiling is below the modelled Year 1 team, a button sets the ceiling as the proposed Year 1 team. Model level only: no price, and not in the client summary.</p>
${tryTool(10,"Set a proposed Year 1 team and read the risks and the commercial options.")}`},

{id:"share",grp:"Review & share",t:"Sharing the estimate",html:()=>`
<span class="eyebrow">Review &amp; share</span>
<h1>What to send to whom</h1>
<div class="tbl"><table><thead><tr><th>Output</th><th>For</th><th>What's in it</th></tr></thead><tbody>
<tr><td><span class="ui">Download summary</span></td><td>Deal review, deal desk</td><td>Every stage's working, allowances, deviations, confidence, sources, scenarios, checks, assumptions and risks</td></tr>
<tr><td><span class="ui">Customer summary</span></td><td>The client</td><td>Coverage in plain words, scope and SLAs, team by role and location, year by year, transition, what we need from them. <b>No</b> contingency, risk, rounding or framework working</td></tr>
<tr><td><span class="ui">Export Excel</span></td><td>Pricing sheet</td><td>Sheets of plain numbers: towers, roles, locations, years, allowances, confidence …, and contract clauses if you listed any</td></tr>
<tr><td><span class="ui">Save file</span></td><td>Colleagues, the deal folder</td><td>Every input, approval and saved scenarios; <span class="ui">Open file</span> reloads it exactly</td></tr>
<tr><td><span class="ui">Add to Prism Library</span></td><td>SAs, the solution library</td><td>Opens the Library with the scale, team by role, years, AIOps use cases and assumptions filled in; you add industry, region and an anonymised description</td></tr>
<tr><td><span class="ui">Copy summary</span></td><td>Slides, notes</td><td>The working as Markdown text</td></tr>
</tbody></table></div>
<div class="warn"><b>Before sending the customer summary</b> It includes your own assumptions as written, so phrase them for the client. Roles are in FTE and locations in people, so the totals differ by rounding; the total row explains it.</div>`},

{id:"example",grp:"Practice",t:"Worked example",html:()=>`
<span class="eyebrow">Practice · 15 min</span>
<h1>Worked example: Acme Retail</h1>
<p class="lead">Build this estimate yourself, then check your numbers against ours. Or <a href="docs/example-acme-retail.damo.json" download>download the finished estimate</a> and open it with <span class="ui">Open file</span>.</p>
<h2>The brief</h2>
<ul>
<li>24×5 support, customer clock UTC+0, starting 00:00. Use <span class="ui">Lay out evenly</span>: India gets two 8-hour windows and Romania the third. Romania's window is <b>on call for P1s only</b>: switch it to <span class="ui">On-call (P1)</span>.</li>
<li><b>AMS</b>: 400 incidents a month from the client's ITSM export. Client keeps L1; we provide L2 + L3. <b>Silver</b> SLA, modern estate, <b>AIOps in scope</b>. Default role only (no special roles).</li>
<li><b>IMS</b>: no ticket history. 4 environments, 2 hosting platforms, 3 databases, security operations in scope. Client L1, us L2 + L3, complex legacy, <b>SRE in scope</b>, no AIOps. Default role only; 0.75 FTE of SRE typed.</li>
<li>Client AI adoption <b>Low</b>; complexity <b>Medium</b>; <b>3-year</b> term; scenario YoY savings.</li>
</ul>
<h2>Check your numbers</h2>
<div class="tbl"><table id="exTbl"><thead><tr><th>Checkpoint</th><th class="r">Expected</th><th>Why</th><th>Got it?</th></tr></thead><tbody></tbody></table></div>
<div class="tip"><b>If a number is off</b> The usual suspects: the counts level on AMS (should be all tickets, L1), the ownership preset (click it even if it looks selected), the SRE FTE on the IMS tower, and Romania's window set to On-call (P1).</div>
${tryTool(1,"Start at step 1 with a fresh estimate (Reset in the header).")}`},
