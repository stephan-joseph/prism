{id:"signin",grp:"Reference",t:"Signing in and roles",html:()=>`
<span class="eyebrow">Reference</span>
<h1>Signing in and roles</h1>
<p class="lead">If your site asks you to sign in, an administrator made your account. This is what each role can do.</p>
<ol class="steps">
<li><div>Open the address. If you are not signed in you land on the sign-in page. Enter your email and password.</div></li>
<li><div>The first time, you use a one-time password from an administrator. Prism asks you to choose your own (at least 12 characters) before you start.</div></li>
<li><div>Your name and role show at the top right. <span class="ui">Sign out</span> ends your session. Sessions last 8 hours and renew while you work.</div></li>
</ol>
<table><thead><tr><th>Role</th><th>What you can do</th></tr></thead><tbody>
<tr><td>Viewer</td><td>Open the tool and this guide and use the calculators. Extraction is switched off.</td></tr>
<tr><td>Estimator</td><td>Everything a viewer can, plus run extraction on documents. Each run is logged with your email, never with the document text.</td></tr>
<tr><td>Admin</td><td>Everything an estimator can, plus add people, change roles, reset passwords and deactivate accounts (<span class="ui">Users</span>), and read the usage report.</td></tr></tbody></table>
<h2>Saving and sharing estimates</h2>
<p>Your work is kept in your own browser. If your site signs people in, you can also keep an estimate on the server and share it. The <a href="#pairing" data-go="pairing">Pairing on a deal</a> chapter has the handover advice for two SAs.</p>
<ol class="steps">
<li><div><span class="ui">File, Save to server</span> saves the estimate on the site. The <b>deal name</b> decides where it goes: a new name makes a new deal, and a name that is already on the server asks you whether to save a <b>new version</b> or a <b>new deal</b>. A banner shows the deal and its version.</div></li>
<li><div><span class="ui">File, Open from server</span> lists your estimates and the ones shared with you. Type in the filter to find a deal or an owner. Opening replaces the estimate on screen, so save the one you are on first.</div></li>
<li><div>In that list, <span class="ui">Share</span> lets you add people by email as <b>view</b> (read only) or <b>edit</b> (they can save changes), or let everyone signed in view it. They need an account first.</div></li>
<li><div>If two people save the same estimate, the second save is not allowed to overwrite the first. Prism offers to open the newer version.</div></li>
<li><div>A <b>view only</b> estimate shows a banner and does not take edits. Use <span class="ui">Save a copy to my estimates</span> to get one you can change.</div></li>
</ol>
<div class="note"><b>Good to know</b> Only the owner or an administrator can share or delete an estimate. Viewer accounts can open what is shared with them but cannot save. There is no live editing together and no version history. File, Save file still gives you a copy you keep yourself.</div>
<div class="note"><b>Passwords</b> Five wrong tries lock the account for 15 minutes. If you forget your password, ask an administrator for a reset. Do not reuse a password from anywhere else: until the site has an encrypted (https) address, the sign-in page shows a warning.</div>`},

const FAQ=[
 ["Can one estimate cover APAC, North America and Europe?","Yes. Pick all three under Geographies to cover in Step 1, whatever the customer location is. Each keeps its own local hours, and the tool shows the combined window. The week is one daily pattern repeated on the days a week, with no daylight saving, so day edges are approximate."],
 ["I cannot run extraction. Why?","Your account may be a viewer. Viewers can use the calculators but not extraction. Ask an administrator to make you an estimator."],
 ["How do my partner and I work on the same deal?","Save it with File, Save to server, then Open from server and Share, adding your partner as edit. They open it from the same menu. Agree who is editing, save before you hand over, and have your partner open it again to see the latest. See the chapter Pairing on a deal."],
 ["My partner shared an estimate but I cannot see it","Open File, Open from server again, because the list loads each time you open it. Check the filter box is empty. If it is still missing, your partner may have typed your email but not pressed Add and then Save sharing: ask them to open Share and check you are in the list. Prism does not notify you when something is shared."],
 ["Why is my estimate view only?","It belongs to someone else and was shared with you to view, or your account is a viewer. Use Save a copy to my estimates to get your own editable copy."],
 ["I saved a second deal and it replaced my first. Why?","Before the deal name decided it, the page kept a link to the record you first saved, so a new estimate saved over it as the next version. Now a new name saves a new deal, and the same name asks whether to make a new version or a new deal. Old versions are never kept, so keep a File, Save file copy of anything you may want back."],
 ["Prism asked me about a deal with the same name","A deal called that is already on the server. Choose New version to replace what is saved in it, or New deal for a separate one. If you did not mean to reuse the name, cancel and change the deal name first."],
 ["Save to server says someone saved a newer version","Another person saved the same estimate after you opened it. Open their version, or keep yours and use File, Save file to keep a copy before opening theirs."],
 ["I forgot my password","Ask an administrator for a reset. They give you a one-time password and you choose a new one at your next sign-in."],
 ["Why did my bottom-up team get bigger when I turned on the coverage floor?","The support window needs a minimum number of people on duty in every hour, whatever the activity hours say. If the L2 and L3 roles from your activities come to less, the gap is added so the team can staff the window. Automation cannot take the team below it."],
 ["I changed the support window in bottom-up and my tower estimate moved. Why?","The support window, locations, complexity, contingency, manager ratio and existing team are shared by both methods. Enter them once; a change in either method changes both."],
 ["Is the service delivery lead counted twice?","It can be: if an activity already gives a delivery lead and managers are sized from a ratio, both count. Step 5 lets you size managers from the activities only, and a check warns when both are on."],
 ["Why did my team jump when I added a tower?","Once the work team is larger than the base team, the work sets the size. Before that, extra work is absorbed by people who are already needed to cover shifts. Look at the Step 4 verdict sentence."],
 ["The bar at the bottom shows a different number from the final estimate.","The bar shows the team after the stage you're on. It becomes the final Year 1 team once Stage 3 has added the transformation capacity (Step 13)."],
 ["Why is rounding adding so much?","People are rounded up in each location and tier (L2, L3, SDM). A small team spread over two locations can gain 2–3 people. Change rounding in Step 1 to see the effect."],
 ["We don't have ticket data. Can we still estimate?","Yes: use structural complexity (T-shirt sizing) or monthly active users. The confidence score will be lower and the range wider; list 'ticket history' as a due diligence item."],
 ["Should I use flat YoY savings or AIOps use cases?","When AIOps is in scope, use cases are the default: they show what the AI engineers would actually build, from which year, and how much effort it removes, so the savings are backed. Flat YoY follows the framework's scenario targets and applies whenever AIOps is not in scope, or if you switch to it."],
 ["Is transition in the Year 1 team?","No. It's a one-off effort before service start, shown in FTE-months in Step 11, the Overall estimate and the customer summary."],
    ["The AIOps savings look small. How do I show a 10 to 15% year-on-year reduction?","Use the Productivity commitment in Step 7. New estimates commit to 12% a year from Year 2, and the year-by-year team follows that line, never below the coverage floor. The use cases, plus a proposed 3% a year of baseline productivity, are the evidence: the table shows the modelled team, the gap and how much of the commitment they support. A gap is delivery risk. To close it, turn on more use cases, raise the autonomy of the agentic ones, bring their waves forward, or lower the commitment."],
["I added a tower and the team size did not change. Why?","Two common reasons. The tower may be empty: answer its questions (ticket history, or the structural size of the estate) and check which levels we provide. Or the base team from Step 1 may be larger than the towers' team, in which case coverage sets the team; Step 2 shows a note when this happens. Change the support window in Step 1 if it is not what the customer asks for."],
["How do I start with a blank estimate every time I open Prism?","File, then Start fresh on every visit. It is a setting for your browser. After that, opening Prism from its address starts a new estimate; reloading the page keeps what is on screen. Use Save file for anything you want to keep."],
["How do I share an estimate with a colleague?","Save file, send the .damo.json, and they use Open file. Saved scenarios travel inside the file."],
 ["How do I add an estimate to the solution library?","After the estimate is approved, File, then Add to Prism Library. The Library opens in a new tab with the form filled in. Add the industry, region and an anonymised description, then submit. Do not put the customer name in the description: the Library refuses it."],
 ["What does 'Changed since approval' mean?","Someone edited an input after the estimate was approved. Approve again or set the status back to Draft."],
 ["Extract inputs says the passphrase is wrong.","Ask the tool owner for the current passphrase; it's set on the Netlify project as INTAKE_PASSPHRASE."],
 ["Do contract clauses change the team size?","No. Clauses only group the team that is already built, so you can show which part of the contract each FTE traces to. Add, edit or remove them and no number moves."],
 ["A tower shows 'Not linked to a clause' in Step 9. What do I do?","Open Contract clauses, or the tower in Step 2, and tick the clauses it serves. If the tower serves no listed clause, leave it. It stays in the table and the total still adds up."],
 ["Where are my estimates stored?","In your browser only, until you Save file. Clearing browser data or using another browser starts fresh."],
 ["Does the SDM count as part of a tower?","No. Service Delivery Managers are sized in Step 4 at 1 per 12 delivery FTE and appear under Governance in the team by role."],
 ["How do I choose between the tower method and bottom-up?","Use the tower method when you have ticket volumes and service towers to size from. Use bottom-up when the RFP lists the activities the supplier must perform and you want to size each one. You can switch from File, Sizing method; each method keeps its own inputs."],
 ["Why does an activity with a lever show no saving in bottom-up?","A lever only releases hours through the use cases behind it. If the activity ticks no use case, or the use cases it ticks are switched off or start later, the lever counts as zero. Step 5 lists these under its checks."],
 ["Why did extraction give an activity no hours?","Extraction never estimates hours. When an activity matches a starter library entry it takes that entry's proposed values; when it does not, you enter the hours."],
];

const GLOSS=[
 ["Geographies to cover","The places whose business hours the support must serve. They are set apart from the customer location, which only sets the clock."],
 ["Cost optimized","A coverage strategy: India works every hour it may inside the shift limits, and the fewest other locations close what is left."],
 ["Local coverage","A coverage strategy: each geography is served mainly by a delivery location in or near it, in its own regular hours."],
 ["Combined window","The hours at least one geography to cover is open, shown on one clock. Overlaps count once."],
 ["Shift limits","The earliest start and latest end, in local time, that a delivery location may work. Off by default."],
 ["Gap finder","Lists the support hours nobody covers and the delivery locations that would close them."],
 ["Coverage floor","In bottom-up, the smallest team that can staff the support window (the tower method's base team). The activities' L2 and L3 roles are topped up to it, and it holds when automation cuts hours."],
 ["Role tier","Whether a bottom-up role is L2, L3 or other. L2 and L3 roles staff the shifts, count toward the coverage floor and are backfilled for leave."],
 ["Grade mix","The delivery team, contingency and manager split into Lead, Senior and Consultant with the complexity's pyramid. A view only."],
 ["FTE","Full-time equivalent: one person working full time (40 hours a week). Part-FTE roles are shared across towers."],
 ["Base team","Step 1: the people needed to keep someone on every shift, whatever the volume."],
 ["Work team","Step 2 (and skill cover, Step 5): the people the work takes, from volumetrics or thin slices. Transformation is counted separately in Stage 3."],
 ["Run team","The team that runs the service: Stage 1 plus Stage 2 (skill cover, SDM re-base, contingency), before any transformation capacity."],
 ["Transformation capacity","The Stage 3 line added to the run team: the Transformation POD (including AI engineers for AIOps) with the SDM and contingency that follow. Year 1 team = run team + transformation capacity."],
 ["Contract clause","A line in the contract or RFP that decides the size or scope of the run team. Linked to the towers that serve it so the team can be traced back to the contract. It never changes the FTE."],
 ["Thin slice","A small unit of scope sized by criticality: an application for AMS, a data product for DMS. Critical, Important or Standard, each with a fixed FTE per slice (proposed, editable)."],
 ["Binding dimension","What sets the Stage 1 number: coverage (the support window) or ticket volume (the work)."],
 ["Reference range","Today's team ± the tolerance. A cross-check on the Stage 1 number, never an input."],
 ["Delivery team","The larger of the base team and the work team. AI engineers are not in it: they join in Stage 3."],
 ["Pass-through","Share of tickets passed to the next level: L1→L2 70%, L2→L3 20% ([F] 1.4)."],
 ["ARE","Average resolution effort per ticket: L1 0.25 h, L2 3 h, L3 10 h."],
 ["A, B, C effort","A: ticket effort; B: non-ticketing effort (automation, patching, governance) at 25% or 35% of A; C: enhancement hours."],
 ["Utilisation","Share of contracted hours a person is productive: 85% ([F] G6). Not a buffer."],
 ["Leave backfill","Extra FTE to cover annual leave and public holidays per location."],
 ["On-call allowance","How much of a staffed shift an on-call (P1 only) shift counts as: 15% flat, or standby + P1 workload."],
 ["Interface","Two adjacent support levels with different owners. Each adds 4% coordination to our ticket effort."],
 ["SLA uplift","Extra L2/L3 effort for stringent SLAs: P1 response ≤15 min +25%, ≤30 min +12%, 99.9% availability +10%, P1 restore ≤2 h +10% on L3; cap 40%."],
 ["AIOps","AI for operations: intelligent alerting, automated root-cause analysis, ticket classification, self-healing."],
 ["AI engineers","Built into towers with AIOps in scope at 1:4 (low AI adoption) or 1:8 (moderate) of support FTE."],
 ["SRE","Site/Service Reliability Engineering. On any tower, the SRE FTE typed for the tower, carved out of its L3, when SRE is in scope."],
 ["Transformation POD","Capacity for SRE, automation, CI/CD and AI adoption: 12.5–20% of the support team by scenario."],
 ["Scenario","Framework Part 3: 1–4 from client AI adoption × volumetrics availability. Sets POD share, AIOps ratio and savings target."],
 ["SDM","Service Delivery Manager: governance, one per 12 delivery FTE."],
 ["Contingency","Extra FTE for estimate risk: 5%, 7.5% or 10% by complexity; tapers from Year 2."],
 ["Coverage floor","The base team. Savings never cut below it when 'Keep the coverage floor' is on."],
 ["Deflection","Share of effort an AIOps use case removes at full adoption, combined per level and capped by a ceiling."],
 ["Confidence score","Annexure 1: nine weighted drivers scored 1–5, out of 100; bands Low / Medium / High / Highest."],
 ["[F], [P], proposed","Source tags: DAMO Solution Estimation Framework, AI_Works pricing sheet, or a value the framework doesn't give."],
 ["Bottom-up (activity based)","The second sizing method: the team comes from the hours of each RFP activity, not from towers and tickets. It is a separate flow with its own inputs."],
 ["Activity","One piece of work in the RFP, with a driver or quantity, hours per unit, an automation lever, roles and the use cases behind the lever."],
 ["Driver","What activities scale with in the bottom-up method, such as alerts a month, pipelines or hosts, with a Year 1 value and a yearly growth."],
 ["Lever","The most hours automation could remove from an activity. It is realised only through the use cases behind it, and only as fast as the realisation curve allows."],
 ["Realisation curve","The share of each lever that is realised in each year, for the base and lean scenarios (proposed values)."],
 ["Starter library","Generic activities by tower kind with invented hours, levers and roles, all proposed, to start an activity list from."],
];

/* ================= calculators ================= */
function calcCov(){
  const H=+$("cvH").value, D=+$("cvD").value, c=Math.max(1,+$("cvC").value||1);
  const kSel=$("cvK"), prev=+kSel.value||0;
  kSel.innerHTML=[...Array(H+1).keys()].filter(i=>i%4===0||i===H).map(i=>`<option value="${i}" ${i===Math.min(prev,H)?"selected":""}>${i}</option>`).join("");
  const k=Math.min(+kSel.value||0,H), oc=Math.max(0,Math.min(100,+$("cvO").value||0))/100;
  const a=H*D, aE=(H-k)*D+k*D*oc, b=40, roster=aE*c/b;
  $("cvOut").innerHTML=`<div class="row"><span>Window hours to cover a week (a)</span><span>${H} × ${D} = ${a}</span></div>
   ${k?`<div class="row"><span>Staffed hours (a′)</span><span>${fmt(aE,1)}</span><div class="f">${(H-k)*D} active + ${k*D} on-call × ${fmt(oc*100,0)}%</div></div>`:""}
   <div class="row"><span>Hours one FTE works (b)</span><span>${b}</span></div>
   <div class="row tot"><span>Roster FTE</span><span>${fmt(roster,2)}</span><div class="f">(${k?"a′":"a"} × ${c}) ÷ ${b}</div></div>
   <div class="row"><span>After 85% utilisation</span><span>${fmt(roster/0.85,2)}</span><div class="f">The tool then adds leave and holiday backfill per location.</div></div>`;
}
const OWN={cl1:{L1:0,L2:1,L3:1,b:1},full:{L1:1,L2:1,L3:1,b:0},l2:{L1:0,L2:1,L3:0,b:2},l3:{L1:0,L2:0,L3:1,b:1}};
const SLA={none:[0,0],bronze:[.12,.22],silver:[.12,.22],gold:[.22,.32]};
function calcTw(){
  const T=Math.max(0,+$("twT").value||0), lvl=$("twL").value, o=OWN[$("twO").value], s=SLA[$("twS").value], bp=$("twE").value==="legacy"?.35:.25;
  let c1,c2,c3;if(lvl==="l1"){c1=T*.3;c2=T*.7;c3=c2*.2}else{c1=0;c2=T;c3=T*.2}
  const l1=o.L1?c1:0,l2=o.L2?c2:0,l3=o.L3?c3:0, h=o.b*.04;
  const raw=l1*.25+l2*3*(1+s[0])+l3*10*(1+s[1]), A=raw/.85*(1+h), B=A*bp, fte=(A+B)/160;
  $("twOut").innerHTML=`<div class="row"><span>Tickets we handle · L1 / L2 / L3</span><span>${fmt(l1,1)} / ${fmt(l2,1)} / ${fmt(l3,1)}</span>${lvl==="l2"&&o.L1?`<div class="f">Counts at L2 don't tell us L1 volume: the tool warns and sizes no L1.</div>`:""}</div>
   <div class="row"><span>SLA uplift · coordination</span><span>+${fmt(s[0]*100,0)}% L2 / +${fmt(s[1]*100,0)}% L3 · +${fmt(h*100,0)}%</span></div>
   <div class="row"><span>A · ticket effort</span><span>${fmt(A,1)} h</span><div class="f">(L1 × 0.25 + L2 × 3 + L3 × 10, with SLA) ÷ 85% × (1 + coordination)</div></div>
   <div class="row"><span>B · non-ticketing effort</span><span>${fmt(B,1)} h</span></div>
   <div class="row tot"><span>Tower FTE</span><span>${fmt(fte,2)}</span><div class="f">(A + B) ÷ 160 hours a month</div></div>`;
}
function calcBU(){
  const v=id=>Math.max(0,+$(id).value||0), q=v("buQ"), f=v("buF"), h=v("buH"), L=Math.min(100,v("buL"))/100, R=Math.min(100,v("buR"))/100, E=Math.min(100,v("buE"))/100, P=Math.max(20,v("buP")||140);
  const base=q*f*h, k=L*R*E, hrs=base*(1-k), rel=base*k, fte=hrs/P, step=Math.ceil(fte/.5-1e-9)*.5;
  $("buOut").innerHTML=`<div class="row"><span>Baseline hours a month</span><span>${fmt(base,1)} h</span><div class="f">quantity × times a month × hours per unit</div></div>
   <div class="row"><span>Hours released</span><span>${fmt(rel,1)} h</span><div class="f">baseline × lever × realisation × efficiency = ${fmt(k*100,1)}% of the baseline</div></div>
   <div class="row"><span>Hours after automation</span><span>${fmt(hrs,1)} h</span></div>
   <div class="row tot"><span>FTE needed · rounded up to 0.5</span><span>${fmt(fte,2)} · ${fmt(step,1)}</span><div class="f">hours ÷ productive hours per FTE a month, then up to the step</div></div>`;
}
function calcSc(){
  const mod=$("scA").value==="moderate", vol=$("scV").value==="1", sc=vol?(mod?4:3):(mod?2:1);
  const pod={1:12.5,2:17.5,3:12.5,4:20}[sc], ratio=mod?8:4, run=Math.max(0,+$("scR").value||0), ai=Math.max(0,+$("scAi").value||0);
  const P=run*pod/100, add=Math.max(0,P-ai);
  $("scOut").innerHTML=`<div class="row tot"><span>Framework scenario</span><span>${sc}</span><div class="f">${mod?"Moderate":"Low"} AI · volumetrics ${vol?"available":"unavailable"}</div></div>
   <div class="row"><span>POD share · AIOps ratio</span><span>${pod}% · 1:${ratio}${ratio===8?" (1:6 over 20 FTE)":""}</span></div>
   <div class="row"><span>Transformation POD</span><span>${fmt(P,2)} FTE</span></div>
   <div class="row tot"><span>Step 10 adds</span><span>${fmt(add,2)} FTE</span><div class="f">POD ${fmt(P,2)} − AI engineers ${fmt(ai,2)}${ai>=P&&ai>0?": the AI engineers already cover the POD":""}</div></div>`;
}
function calcRe(){
  const B=Math.max(0,+$("reB").value||0), W=Math.max(0,+$("reW").value||0), r=Math.max(1,+$("reS").value||12);
  const del=Math.max(W,B), sdm=del/r;
  $("reOut").innerHTML=`<div class="row"><span>${W>=B?"Work team is larger: kept":"Base team is larger: team lifted to it"}</span><span>${fmt(Math.max(W,B),2)}</span>${W<B?`<div class="f">${fmt(B-W,2)} FTE of spare time for enhancements or transformation</div>`:""}</div>
   <div class="row"><span>Delivery team</span><span>${fmt(del,2)}</span></div>
   <div class="row"><span>+ SDM (1 per ${r})</span><span>${fmt(sdm,2)}</span></div>
   <div class="row tot"><span>Team after Step 4</span><span>${fmt(del+sdm,2)} FTE</span></div>`;
}

/* ================= quiz ================= */
function renderQuiz(ch){
  const el=document.querySelector(`[data-quiz="${ch.id}"]`);if(!el||!ch.quiz)return;
  const st=P.quiz[ch.id]||{};
  el.innerHTML=`<h3>Check your understanding</h3>`+ch.quiz.map((q,i)=>`<div class="q" data-qi="${i}"><p>${esc(q.q)}</p><div class="opts">${q.o.map((o,j)=>`<button type="button" data-qa="${ch.id}:${i}:${j}" class="${st[i]!=null?(j===q.a?"right":(st[i]===j?"wrong":"")):""}">${esc(o)}</button>`).join("")}</div>${st[i]!=null?`<div class="why">${st[i]===q.a?"Right. ":"Not quite. "}${esc(q.why)}</div>`:""}</div>`).join("")
    +`<div class="score">${Object.keys(st).length?`${ch.quiz.filter((q,i)=>st[i]===q.a).length} right of ${Object.keys(st).length} answered${Object.keys(st).length<ch.quiz.length?` · ${ch.quiz.length-Object.keys(st).length} to go`:""}`:""}</div>`;
}

/* ================= render ================= */
let cur=0;
function renderToc(){
  let h="",g="";
  CH.forEach((c,i)=>{if(c.grp!==g){g=c.grp;h+=`<li class="grp">${esc(g)}</li>`}
    h+=`<li class="${P.done[c.id]?"done":""}"><button type="button" data-ch="${i}" ${i===cur?'aria-current="page"':""}><span class="n">${P.done[c.id]?"✓":i+1}</span>${esc(c.t)}</button></li>`});
  $("toc").innerHTML=h;
  $("tocSel").innerHTML=CH.map((c,i)=>`<option value="${i}" ${i===cur?"selected":""}>${i+1}. ${esc(c.t)}${P.done[c.id]?" ✓":""}</option>`).join("");
  const n=CH.filter(c=>P.done[c.id]).length;
  $("progTxt").textContent=`${n} of ${CH.length} read`;$("progBar").style.width=(n/CH.length*100)+"%";
}
function show(i,focus){
  cur=Math.max(0,Math.min(CH.length-1,i));const ch=CH[cur];
  $("chap").innerHTML=ch.html()+`<div class="chapnav">${cur>0?`<button type="button" class="btn" data-ch="${cur-1}">← ${esc(CH[cur-1].t)}</button>`:"<span></span>"}${cur<CH.length-1?`<button type="button" class="btn primary" data-next="1">Mark as read · next: ${esc(CH[cur+1].t)} →</button>`:`<button type="button" class="btn primary" data-next="1">Mark as read</button>`}</div>`;
  if(ch.id==="prep")$("prepList").innerHTML=PREP.map((t,k)=>`<li><label><input type="checkbox" data-prep="${k}" ${P.check[k]?"checked":""}><span>${esc(t)}</span></label></li>`).join("");
  if(ch.id==="example")$("exTbl").querySelector("tbody").innerHTML=EXAMPLE.map((r,k)=>`<tr><td><b>${esc(r[0])}</b></td><td class="r mono">${esc(r[1])}</td><td style="color:var(--muted);font-size:14px">${esc(r[2])}</td><td><input type="checkbox" data-ex="${k}" ${P.check["ex"+k]?"checked":""} aria-label="Matched ${esc(r[0])}"></td></tr>`).join("");
  if(ch.id==="faq"){const r=q=>{$("faqList").innerHTML=FAQ.filter(f=>!q||(f[0]+f[1]).toLowerCase().includes(q)).map(f=>`<details class="faq"><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join("")||"<p>No matches.</p>"};r("");$("faqQ").oninput=e=>r(e.target.value.toLowerCase())}
  if(ch.id==="glossary"){const r=q=>{$("glList").innerHTML=GLOSS.filter(g=>!q||(g[0]+g[1]).toLowerCase().includes(q)).map(g=>`<div><dt>${esc(g[0])}</dt><dd>${esc(g[1])}</dd></div>`).join("")||"<p>No matches.</p>"};r("");$("glQ").oninput=e=>r(e.target.value.toLowerCase())}
  if($("calcCov"))calcCov();if($("calcTw"))calcTw();if($("calcSc"))calcSc();if($("calcRe"))calcRe();if($("calcBU"))calcBU();
  renderQuiz(ch);renderToc();
  P.last=cur;save();
  try{history.replaceState(null,"","#"+ch.id)}catch(e){}
  if(focus){window.scrollTo({top:0});$("chap").focus({preventScroll:true})}
}
document.addEventListener("click",e=>{
  /* a link to another chapter: <a href="#id" data-go="id"> */
  const a=e.target.closest("a[data-go]");
  if(a){const i=CH.findIndex(c=>c.id===a.dataset.go);if(i>=0){e.preventDefault();show(i,true)}return}
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.ch!=null){show(+d.ch,true)}
  else if(d.next){P.done[CH[cur].id]=true;save();if(cur<CH.length-1)show(cur+1,true);else renderToc()}
  else if(d.qa){const [id,qi,j]=d.qa.split(":");P.quiz[id]=P.quiz[id]||{};P.quiz[id][qi]=+j;save();renderQuiz(CH.find(c=>c.id===id))}
});
document.addEventListener("input",e=>{const t=e.target;if(t.closest("#calcCov"))calcCov();if(t.closest("#calcTw"))calcTw();if(t.closest("#calcSc"))calcSc();if(t.closest("#calcRe"))calcRe();if(t.closest("#calcBU"))calcBU()});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
  if(d.prep!=null){P.check[d.prep]=t.checked;save()}
  else if(d.ex!=null){P.check["ex"+d.ex]=t.checked;save()}
  else if(t.id==="tocSel")show(+t.value,true);
  else if(t.closest("#calcCov"))calcCov();else if(t.closest("#calcTw"))calcTw();else if(t.closest("#calcSc"))calcSc();else if(t.closest("#calcRe"))calcRe();else if(t.closest("#calcBU"))calcBU();
});
const fromHash=CH.findIndex(c=>"#"+c.id===location.hash);
show(fromHash>=0?fromHash:(P.last||0),false);
})();
</script>
</body>
</html>
